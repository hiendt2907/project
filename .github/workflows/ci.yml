# CI runs two jobs:
#   test         — Python unit + contract tests (no cluster needed)
#   docker-image — build validation for worker, gateway, HITL dispatcher, and HITL API images
#
# CLUSTER-DEPENDENT GATES (lab-only, NOT run here):
#   make siem-lab-gate        — full Smart-SIEM capability proof (needs Kafka/Redis/HITL port-forwards)
#   make prove-siem-capabilities — CAP-1 through CAP-6 live proof
#   make siem-proof-3x        — 3-run flake burn-in
#   bash scripts/verify_hitl_production.sh — in-cluster readiness gate
#   NS=<ns> bash scripts/gateway_alert_loki_verify.sh — full pipeline E2E (NS required; lab: multi-agent); optional E2E_ASSERT_TELEGRAM_BOT_API=1
#
# To run lab gates: `make siem-lab-gate` with port-forwards active on the lab cluster.
# See: docs/runbooks/siem-capability-proof.md
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (critical fail)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.2 detect --no-git --source=/repo --config=/repo/.gitleaks.toml --report-path=/repo/leak_report.json --verbose

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Env mode gate
        run: python scripts/validate_env_mode_gate.py

      - name: Mutate-only gate
        run: python scripts/validate_mutate_only_gate.py

      - name: Classifier regression gate
        run: python scripts/validate_classifier_regression_gate.py

      - name: Phase docs gate
        run: python scripts/validate_phase_docs_gate.py

      - name: Omni unit tests + coverage gate (>=90%)
        run: pytest tests/ --ignore=tests/integration --ignore=tests/real_services -q --tb=short --cov=src --cov-config=.coveragerc.gate --cov-report=term --cov-fail-under=90

      - name: Advisory schema gate (no LLM required)
        run: pytest tests/benchmarks/test_advisory_schema.py -q --tb=short

      - name: Integration tests (mock-safe, no real services)
        run: pytest tests/integration/ -q --tb=short -m "not requires_services"

      - name: Script syntax check (SIEM scripts)
        # Validate scripts are syntactically correct without executing them.
        # Gateway / matrix helpers require NS at runtime (no default in-script); lab contract: NS=multi-agent.
        run: |
          bash -n scripts/verify_hitl_production.sh
          bash -n scripts/rotate_hitl_token.sh
          bash -n scripts/gateway_alert_loki_verify.sh
          bash -n scripts/e2e_one_alert_full_advisory_path.sh
          bash -n scripts/e2e_collect_trace_evidence.sh

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: multi-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gateway
          push: false
          tags: omni-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build HITL dispatcher image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.hitl-dispatcher
          push: false
          tags: omni-hitl-dispatcher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build HITL API image
        uses: docker/build-push-action@v6
        with:
          context: ./smart-siem
          file: ./smart-siem/Dockerfile.hitl-api
          push: false
          tags: finguard-hitl-api:lab
          cache-from: type=gha
          cache-to: type=gha,mode=max
