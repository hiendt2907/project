# Rebuild / validate internal MkDocs wiki when application source or wiki sources change.
name: wiki

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "docs/**"
      - "reports/**"
      - "wiki/**"
      - "scripts/wiki_build.sh"
      - "scripts/wiki_serve.sh"
      - ".github/workflows/wiki.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "docs/**"
      - "reports/**"
      - "wiki/**"
      - "scripts/wiki_build.sh"
      - "scripts/wiki_serve.sh"
      - ".github/workflows/wiki.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r wiki/requirements-docs.txt

      - name: Build wiki (strict)
        run: bash scripts/wiki_build.sh

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-wiki-site
          path: wiki/site
