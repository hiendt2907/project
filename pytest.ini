[pytest]
asyncio_mode = auto
pythonpath = src scripts
testpaths = tests
addopts = -m "not integration"
markers =
    integration: live service tests requiring real infra (Kafka/Redis/K8s) — run with -m integration
    requires_services: tests that need real Redis/Kafka/Postgres — run locally with services up
    benchmark: advisory quality benchmark against live LLM (skip with -m "not benchmark")
    lane1: Lane 1 (SYS_RESOURCE) tests — ThreeSigmaGate, baseline_snapshot, resource pipeline
    lane2: Lane 2 (SYS_HARD_FAIL) tests — OS state validator, coerce_evidence_dict, contrast path
