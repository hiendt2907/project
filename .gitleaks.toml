title = "Omni Gitleaks Config"

[allowlist]
description = "Bỏ qua các file tài liệu và mock test"
paths = [
    '''docs/.*''',
    '''tests/mocks/.*''',
    '''docs/reports/project-memory\.md''',
    '''tests/test_normalize\.py''',
    '''.*__pycache__/.*''',
    '''\.venv/.*''',
    '''\.env''',
    '''leak_report\.json''',
    '''leak_report_history\.json''',
    '''deployments/.*''',
    '''\.cursor/.*''',
    '''smart-siem/vendor/.*''',
    '''smart-siem/.*\.md''',
    '''smart-siem/\.gitea/.*''',
    '''smart-siem/\.github/.*''',
    '''smart-siem/tests/.*''',
    '''ui/node_modules/.*''',
    '''node_modules/.*''',
]
# Placeholder cố ý giả — Jenkinsfile ("Deploy monitoring" stage) tự sinh secret
# grafana-telegram-alerting với giá trị này CHỈ để thoả điều kiện "không rỗng"
# của initContainer alerting provisioning (nó hard-fail nếu bot-token trống);
# khớp đúng regex omni-telegram-token bên dưới vì cố tình có hình dạng token
# thật — không phải leak. Build #37 là lần đầu Security scan thật sự chạy tới
# (mọi build trước fail sớm hơn ở pytest gate), 2026-08-10.
regexes = [
    '''0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA''',
]

[[rules]]
description = "Chặn Postgres DSN (Omni Core DB)"
id = "omni-postgres-dsn"
regex = '''postgres(ql)?://[a-zA-Z0-9_]+:[a-zA-Z0-9_]+@[a-z0-9.-]+:[0-9]+/'''
keywords = ["postgres", "postgresql"]

[[rules]]
description = "Chặn Telegram Bot Token (Omni Alerts)"
id = "omni-telegram-token"
regex = '''[0-9]{7,10}:[a-zA-Z0-9_-]{35}'''
keywords = ["tele", "bot"]

[[rules]]
description = "Chặn Generic API Keys & Secrets"
id = "generic-api-key"
regex = '''(?i)(key|api|token|secret|password|passwd|pwd)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9/+=]{16,45}'''
entropy = 3.5

[[rules]]
description = "Chặn Private Keys"
id = "private-key"
regex = '''-----BEGIN [A-Z ]+ PRIVATE KEY-----'''
