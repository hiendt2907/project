repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (pkg/anomaly/rag must not import workers/)
        entry: make lint-imports
        language: system
        pass_filenames: false
        always_run: true
