# External Secrets Operator -> Vault wiring. Vault itself (init/unseal/policy/
# kubernetes-auth-role) is bootstrapped imperatively by vault-bootstrap.sh —
# there is no safe declarative way to "apply" a Shamir unseal key, it has to
# be generated once and handled as a real secret outside git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
