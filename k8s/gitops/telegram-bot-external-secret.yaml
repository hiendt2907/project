# telegram-bot secret sourced from Vault instead of the old bootstrap-once
# `kubectl create secret` (Đ49, 2026-08-11) — real root cause of "Telegram im
# lặng nhiều build": Jenkinsfile's "Apply manifests" stage ran BEFORE Vault
# existed on a fresh cluster, so this secret was originally created via plain
# `kubectl apply -f k8s/deployments/telegram-bot-secret.yaml` (a git-tracked
# placeholder, bot-token=""). Every build re-applied it unconditionally,
# silently wiping any real token set by hand. Same pattern as
# omni-gateway-external-secret.yaml/aoip-dex-external-secret.yaml — that
# file's own comment already flagged telegram-bot as the next candidate for
# this exact conversion.
#
# One-time Vault write (imperative, same reasoning as vault-clustersecretstore.yaml):
#   kubectl exec -n vault vault-0 -- vault kv put secret/telegram-bot \
#     bot-token='<real bot token>' chat-id='<real chat id>'
#
# k8s/deployments/telegram-bot-secret.yaml (git placeholder) is now UNUSED —
# this ExternalSecret is the sole owner of the `telegram-bot` Secret object.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-bot
  namespace: multi-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: telegram-bot
    creationPolicy: Owner
  data:
    - secretKey: bot-token
      remoteRef:
        key: telegram-bot
        property: bot-token
    - secretKey: chat-id
      remoteRef:
        key: telegram-bot
        property: chat-id
