# Locks Grafana/Prometheus behind Traefik BasicAuth + TLS — "chỉ tôi được vào"
# per explicit request 2026-08-04. Password lives ONLY in the
# monitoring-basicauth Secret (generated once, never in git); this file just
# wires the Middleware + Ingress + Secret shape.
#
# Vault UI's public Ingress was REMOVED 2026-08-04 per explicit request: only
# ArgoCD stays public from the GitOps toolchain, everything else (Harbor,
# Vault UI) moves back to cluster-internal. Reach Vault via
# `kubectl port-forward -n vault svc/vault 8200:8200`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: monitoring-basicauth
  namespace: monitor
spec:
  basicAuth:
    secret: monitoring-basicauth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-gcp
  namespace: monitor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: monitor-monitoring-basicauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [grafana.omnisre.xyz]
      secretName: grafana-omnisre-tls
  rules:
    - host: grafana.omnisre.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: grafana, port: {number: 3000}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-gcp
  namespace: monitor
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: monitor-monitoring-basicauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [prometheus.omnisre.xyz]
      secretName: prometheus-omnisre-tls
  rules:
    - host: prometheus.omnisre.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: prometheus, port: {number: 9090}}
