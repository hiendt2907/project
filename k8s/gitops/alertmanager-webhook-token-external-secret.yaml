# Alertmanager (namespace `monitor`) cần OMNI_ALERTMANAGER_WEBHOOK_TOKEN để gọi
# /webhook/prometheus của omni-gateway (namespace `multi-agent`) sau khi gateway
# bật fail-closed (P0 #1, 2026-08-10). K8s Secret không cross-namespace được, nên
# ExternalSecret riêng ở đây — cùng property Vault với omni-gateway-external-secret.yaml
# (secret/omni-gateway-secret, property OMNI_ALERTMANAGER_WEBHOOK_TOKEN), một nguồn
# sự thật duy nhất, chỉ đồng bộ ra 2 Secret ở 2 namespace khác nhau.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-webhook-token
  namespace: monitor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-webhook-token
    creationPolicy: Owner
  data:
    - secretKey: OMNI_ALERTMANAGER_WEBHOOK_TOKEN
      remoteRef:
        key: omni-gateway-secret
        property: OMNI_ALERTMANAGER_WEBHOOK_TOKEN
