# NVIDIA NIM API key, sourced from Vault instead of a plaintext ConfigMap/Secret.
# Same ExternalSecret pattern as aoip-dex-secret.yaml / omni-gateway-secret.
# Vault write (one-time, not declarative):
#   vault kv put secret/omni-nim-secret api_key=nvapi-...
#
# omni-fullstack.yaml's OMNI_NIM_API_KEY env reads this Secret's api_key key via
# secretKeyRef. Switching OMNI_LLM_PROVIDER=nim in omni-worker-configmap.gcp.yaml
# is what actually activates NIM (src/llm/factory.py reads both).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omni-nim-secret
  namespace: multi-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: omni-nim-secret
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: omni-nim-secret
        property: api_key
