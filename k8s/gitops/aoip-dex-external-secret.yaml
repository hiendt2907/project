# aoip-dex's OIDC client secrets, sourced from Vault instead of a plaintext
# ConfigMap. Same pattern as omni-gateway-secret (omni-gateway-external-secret.yaml)
# — the twist here is Dex only ever reads a whole config FILE
# (`dex serve /etc/dex/config.yaml`), not individual env vars, so `target.template`
# renders the full config.yaml from the two fetched values instead of just passing
# them through. Vault write (one-time, not declarative — same reasoning as
# vault-clustersecretstore.yaml's note on vault-bootstrap.sh):
#   vault kv put secret/aoip-dex-secret \
#     provider_secret=$(openssl rand -hex 24) \
#     tenant_secret=$(openssl rand -hex 24)
#
# aoip-dex.gcp.yaml's Deployment mounts the resulting Secret (key: config.yaml)
# in place of the old aoip-dex-config ConfigMap. aoip-portals.gcp.yaml's
# AOIP_OIDC_{PROVIDER,TENANT}_CLIENT_SECRET read provider_secret/tenant_secret
# from this same Secret via secretKeyRef, so both sides always agree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aoip-dex-secret
  namespace: multi-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aoip-dex-secret
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Merge
      data:
        config.yaml: |
          issuer: https://dex.omnisre.xyz/dex
          storage:
            type: memory
          web:
            http: 0.0.0.0:5556
          oauth2:
            skipApprovalScreen: true
          staticClients:
            - id: aoip-provider-portal
              name: AOIP Provider Operations Portal
              secret: {{ .provider_secret }}
              redirectURIs:
                - https://provider.omnisre.xyz/auth/callback
                - https://app.omnisre.xyz/auth/callback
            - id: aoip-tenant-portal
              name: AOIP Tenant Operations Portal
              secret: {{ .tenant_secret }}
              redirectURIs:
                - https://tenant.omnisre.xyz/auth/callback
          enablePasswordDB: true
  data:
    - secretKey: provider_secret
      remoteRef:
        key: aoip-dex-secret
        property: provider_secret
    - secretKey: tenant_secret
      remoteRef:
        key: aoip-dex-secret
        property: tenant_secret
