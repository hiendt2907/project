# Harbor Helm values — GCP single-node k3s. Registry for GitOps image promotion
# (ArgoCD pulls from here instead of relying on `k3s ctr images import` by hand).
# trivy/notary disabled to save RAM on a single 16GB node; re-enable later if
# vulnerability scanning becomes a real requirement.
#
# ClusterIP only, no public ingress — explicit request 2026-08-04: only ArgoCD
# stays public from the GitOps toolchain, everything else moves back to
# cluster-internal. Reach it via `kubectl port-forward -n harbor svc/harbor-portal 8080:80`.
expose:
  type: clusterIP
  tls:
    enabled: false
externalURL: http://harbor-core.harbor.svc.cluster.local:80
trivy:
  enabled: false
notary:
  enabled: false
persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      size: 20Gi
    database:
      size: 5Gi
    redis:
      size: 2Gi
    jobservice:
      jobLog:
        size: 1Gi
    trivy:
      size: 1Gi
