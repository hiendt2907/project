# Harbor Helm values — GCP single-node k3s. Registry for GitOps image promotion
# (ArgoCD pulls from here instead of relying on `k3s ctr images import` by hand).
# trivy/notary disabled to save RAM on a single 16GB node; re-enable later if
# vulnerability scanning becomes a real requirement.
#
# ClusterIP only, no public ingress — explicit request 2026-08-04: only ArgoCD
# stays public from the GitOps toolchain, everything else moves back to
# cluster-internal. Reach it via `kubectl port-forward -n harbor svc/harbor 8080:80` —
# that's the chart's nginx reverse-proxy Service (fronts core+portal, routes
# /v2, /api, /service to harbor-core). `svc/harbor-portal` only backs the
# static web console and does NOT proxy the registry API — port-forwarding to
# it directly breaks `docker login`/push/pull.
expose:
  type: clusterIP
  tls:
    enabled: false
externalURL: http://harbor-core.harbor.svc.cluster.local:80
trivy:
  enabled: false
notary:
  enabled: false
persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      size: 20Gi
    database:
      size: 5Gi
    redis:
      size: 2Gi
    jobservice:
      jobLog:
        size: 1Gi
    trivy:
      size: 1Gi
