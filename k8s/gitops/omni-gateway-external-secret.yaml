# PoC: omni-gateway-secret sourced from Vault instead of a hand-run
# `kubectl create secret`. Verified live end-to-end 2026-08-04 — value in
# Vault (`vault kv get secret/omni-gateway-secret`) matches the synced k8s
# Secret exactly, and omni-gateway kept serving /healthz through the cutover.
# Same pattern extends to the other ad-hoc secrets (omni-audit-keys,
# telegram-bot, grafana-admin) once there's a real need to rotate them
# through Vault instead of the current per-secret bootstrap scripts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omni-gateway-secret
  namespace: multi-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: omni-gateway-secret
    creationPolicy: Owner
  data:
    - secretKey: OMNI_GATEWAY_API_KEY
      remoteRef:
        key: omni-gateway-secret
        property: OMNI_GATEWAY_API_KEY
    # Bearer token cho Alertmanager nội bộ (P0 #1 follow-up, 2026-08-10) — xem
    # _verify_webhook_auth() trong src/gateway/api.py. Vault đã có key này qua
    # `vault kv patch secret/omni-gateway-secret OMNI_ALERTMANAGER_WEBHOOK_TOKEN=...`
    # (merge, không đụng OMNI_GATEWAY_API_KEY hiện có).
    - secretKey: OMNI_ALERTMANAGER_WEBHOOK_TOKEN
      remoteRef:
        key: omni-gateway-secret
        property: OMNI_ALERTMANAGER_WEBHOOK_TOKEN
