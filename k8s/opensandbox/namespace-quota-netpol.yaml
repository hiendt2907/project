# OpenSandbox — namespace + quota + network isolation (ARM64: chọn image server từ upstream)
---
apiVersion: v1
kind: Namespace
metadata:
  name: opensandbox
  labels:
    app.kubernetes.io/name: opensandbox
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: opensandbox-quota
  namespace: opensandbox
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "20"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: opensandbox-limits
  namespace: opensandbox
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "25m"
        memory: 64Mi
      default:
        cpu: "500m"
        memory: 512Mi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensandbox-default-deny
  namespace: opensandbox
spec:
  # Không áp deny-ingress lên shim (shim có policy riêng); Job exec vẫn bị deny ingress.
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [opensandbox-shim]
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Cho phép nội bộ cluster (siết thêm theo nhu cầu egress gateway upstream)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 11434
