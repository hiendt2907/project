---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensandbox-shim
  namespace: opensandbox
  labels:
    app: opensandbox-shim
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensandbox-shim-job-runner
  namespace: opensandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensandbox-shim-job-runner
  namespace: opensandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensandbox-shim-job-runner
subjects:
  - kind: ServiceAccount
    name: opensandbox-shim
    namespace: opensandbox
