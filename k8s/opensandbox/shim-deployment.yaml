# Shim — POST /api/v1/execute → Job busybox trong opensandbox (ARM64: image build local)
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-shim
  namespace: opensandbox
  labels:
    app: opensandbox-shim
spec:
  type: ClusterIP
  selector:
    app: opensandbox-shim
  ports:
    - name: http
      port: 8888
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-shim
  namespace: opensandbox
  labels:
    app: opensandbox-shim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensandbox-shim
  template:
    metadata:
      labels:
        app: opensandbox-shim
    spec:
      serviceAccountName: opensandbox-shim
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: shim
          image: opensandbox-shim:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SANDBOX_NAMESPACE
              value: opensandbox
            - name: SHIM_LISTEN_PORT
              value: "8888"
          ports:
            - name: http
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: "25m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
