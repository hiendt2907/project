ingressClass:
  enabled: true
  isDefaultClass: false   # nginx vẫn là default trong lúc migrate

ports:
  web:
    port: 80
  websecure:
    port: 443

service:
  type: LoadBalancer

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true   # ingress trải nhiều namespace
  kubernetesIngress:
    enabled: true

api:
  dashboard: true
  insecure: true   # lab only

logs:
  general:
    level: INFO
