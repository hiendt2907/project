# Traefik Middleware CRDs — ai-agent.local lab
# Middleware phải cùng namespace với Ingress tham chiếu nó.
# Reference format trong annotation: <namespace>-<name>@kubernetescrd

# ── multi-agent ───────────────────────────────────────────────────────────────
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sse-buffering-off
  namespace: multi-agent
spec:
  headers:
    customResponseHeaders:
      X-Accel-Buffering: "no"

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit-10m
  namespace: multi-agent
spec:
  buffering:
    maxRequestBodyBytes: 10485760   # 10 MiB

