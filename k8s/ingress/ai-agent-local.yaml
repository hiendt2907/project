---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omni-ui
  namespace: multi-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/hsts: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: omni.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omni-ui
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siem-dashboard-ingress
  namespace: smart-siem
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/hsts: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: siem.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: siem-ui
                port:
                  number: 80
