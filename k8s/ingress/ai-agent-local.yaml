# ─────────────────────────────────────────────────────────────────────────────
# Ingress manifest — ai-agent.local lab domain
#
# ingressClassName: traefik (Traefik v3, Helm-installed in namespace traefik)
# Hosts mapped in /etc/hosts → OrbStack LB IP (run: make hosts-update)
#
# Domain map:
#   portal.ai-agent.local     → multi-agent/omni-ui:80 (Omni admin / config)
#   omni.ai-agent.local       → multi-agent/omni-ui:80 (Omni ops / HITL / monitor)
#   gateway.ai-agent.local    → multi-agent/omni-gateway:80   (SSE streaming)
#   soc.ai-agent.local        → smart-siem/siem-ui:80
#   soc.ai-agent.local/api    → smart-siem/siem-ui-api:8080
#   finguard.ai-agent.local   → finguard-customer/finguard-ui-frontend:80
#   finguard.ai-agent.local/api → finguard-customer/finguard-ui-api:8080
# ─────────────────────────────────────────────────────────────────────────────

# ── multi-agent: Omni UI ──────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omni-ui
  namespace: multi-agent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: multi-agent-body-limit-10m@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: portal.ai-agent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omni-ui
                port:
                  number: 80
    - host: omni.ai-agent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omni-ui
                port:
                  number: 80

# ── multi-agent: Omni Gateway (SSE / long-polling) ───────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omni-gateway
  namespace: multi-agent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: >-
      multi-agent-sse-buffering-off@kubernetescrd,multi-agent-body-limit-10m@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gateway.ai-agent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omni-gateway
                port:
                  number: 80

# ── multi-agent: SSE-only routes (NO buffering middleware) ───────────────────
# The body-limit-10m middleware is a Traefik `buffering` middleware which buffers
# the RESPONSE and breaks Server-Sent Events. These dedicated, more-specific paths
# route the long-lived SSE streams WITHOUT body-limit so Traefik streams them.
# Longer path ⇒ higher Traefik router priority, so they win over the `/` rules above.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omni-gateway-sse
  namespace: multi-agent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: multi-agent-sse-buffering-off@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gateway.ai-agent.local
      http:
        paths:
          - path: /trace/stream
            pathType: Prefix
            backend:
              service:
                name: omni-gateway
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omni-ui-sse
  namespace: multi-agent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: multi-agent-sse-buffering-off@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: portal.ai-agent.local
      http:
        paths:
          - path: /api/trace/stream
            pathType: Prefix
            backend:
              service:
                name: omni-ui
                port:
                  number: 80
    - host: omni.ai-agent.local
      http:
        paths:
          - path: /api/trace/stream
            pathType: Prefix
            backend:
              service:
                name: omni-ui
                port:
                  number: 80

# ── smart-siem: FinGuard SOC UI + BFF ────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siem-ui
  namespace: smart-siem
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: >-
      smart-siem-sse-buffering-off@kubernetescrd,smart-siem-body-limit-10m@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: soc.ai-agent.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: siem-ui-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: siem-ui
                port:
                  number: 80

# ── finguard-customer: Vite frontend + customer BFF ──────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finguard-ui
  namespace: finguard-customer
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: >-
      finguard-customer-sse-buffering-off@kubernetescrd,finguard-customer-body-limit-10m@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: finguard.ai-agent.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: finguard-ui-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finguard-ui-frontend
                port:
                  number: 80
