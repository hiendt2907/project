metadata:
  name: aoip-tenant-portal-gcp
  namespace: multi-agent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [tenant.omnisre.xyz]
      secretName: tenant-omnisre-tls
  rules:
    - host: tenant.omnisre.xyz
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service: {name: aoip-tenant-portal, port: {number: 8082}}
          - path: /api/tenant/v1
            pathType: Prefix
            backend:
              service: {name: aoip-tenant-portal, port: {number: 8082}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: aoip-tenant-web, port: {number: 3002}}

# ── aoip-dex ───────────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aoip-dex-gcp
  namespace: multi-agent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
