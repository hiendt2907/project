# NetworkPolicy for Omni worker pods (omni-analyst, omni-prober, omni-executor,
# omni-core, omni-hitl-dispatcher, omni-siem-bridge, omni-evidence-adapter).
#
# Design: each pod type gets its own policy. Having a NetworkPolicy implicitly
# denies all traffic not explicitly allowed (Ingress + Egress policyTypes declared).
#
# Ingress allowed:
#   - Prometheus (monitor ns) → metrics :9090
#   - Any pod in namespace → health server :8090 (K8s probes route via kubelet node IP
#     which bypasses NetworkPolicy in OrbStack CNI, but allow explicitly for other CNIs)
#
# Egress allowed per role:
#   - All:       Redis :6379, Kafka :9092, DNS :53
#   - analyst:   + Ollama :11434 (host.orb.internal)
#   - prober:    + Prometheus :9090
#   - executor:  + K8s API :443 (kube-apiserver)
#   - core:      + Prometheus :9090
#   - hitl:      + FinGuard HITL API :8081 (finguard-customer namespace)
#
#   kubectl apply -f k8s/network-policies/omni-workers-netpol.yaml
#
---
# ── omni-analyst ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omni-analyst-netpol
  namespace: multi-agent
spec:
  podSelector:
    matchLabels:
      app: omni-analyst
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor
      ports:
        - protocol: TCP
          port: 9090
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Ollama runs on host.orb.internal — external to cluster
    - ports:
        - protocol: TCP
          port: 11434
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
