apiVersion: batch/v1
kind: CronJob
metadata:
  name: crat-integrity-check
  namespace: multi-agent
  labels:
    app: crat-integrity-check
    component: audit
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: crat-integrity-check
        spec:
          restartPolicy: OnFailure
          serviceAccountName: omni-worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: crat-check
              image: ghcr.io/omni/multi-agent-system:latest
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /app/scripts/crat_integrity_check.py
              env:
                - name: OMNI_REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: omni-worker-config
                      key: OMNI_REDIS_URL
                      optional: false
                - name: CRAT_METRIC_FILE
                  value: /tmp/crat_integrity.prom
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
