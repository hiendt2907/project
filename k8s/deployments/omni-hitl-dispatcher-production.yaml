---
# Production-grade HITL Dispatcher manifest.
# Differences from lab YAML:
#   - Dedicated image (omni-hitl-dispatcher) instead of multi-agent-system
#   - PodDisruptionBudget: minAvailable=1 so rolling updates don't drop in-flight approvals
#   - NetworkPolicy: only egress to Kafka, Omni Redis, FinGuard HITL API
#   - Resource limits tuned: dispatcher is I/O-bound (polling), not CPU-bound
#   - Liveness/readiness probes via /healthz sidecar pattern (process-level healthcheck)
#   - HITL_MAX_CONCURRENT capped at 32 to bound connection pool usage
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-hitl-dispatcher
  namespace: multi-agent
  labels:
    app.kubernetes.io/name: omni-hitl-dispatcher
    app.kubernetes.io/component: hitl-dispatcher
    app.kubernetes.io/part-of: omni
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-hitl-dispatcher
  namespace: multi-agent
  labels:
    app: omni-hitl-dispatcher
    app.kubernetes.io/name: omni-hitl-dispatcher
    app.kubernetes.io/component: hitl-dispatcher
    app.kubernetes.io/part-of: omni
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # never kill old pod before new is Ready
      maxSurge: 1
  selector:
    matchLabels:
      app: omni-hitl-dispatcher
  template:
    metadata:
      labels:
        app: omni-hitl-dispatcher
      annotations:
        prometheus.io/scrape: "false"   # dispatcher has no metrics endpoint
    spec:
      serviceAccountName: omni-hitl-dispatcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120  # allow in-flight approvals to drain
      containers:
        - name: hitl-dispatcher
          image: omni-hitl-dispatcher:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "workers.hitl_dispatcher"]
          env:
            - name: OMNI_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: OMNI_KAFKA_TOPIC_HITL_PENDING
              value: "omni-hitl-pending"
            - name: OMNI_KAFKA_TOPIC_ACTIONS
              value: "omni-actions"
            - name: OMNI_KAFKA_TOPIC_ACTION_FEEDBACK
              value: "omni-action-feedback"
            - name: OMNI_REDIS_URL
              value: "redis://redis:6379/0"
            - name: HITL_API_BASE_URL
              value: "http://finguard-hitl-api.finguard-customer.svc.cluster.local:8081"
            - name: HITL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hitl-dispatcher-secret
                  key: hitl_api_token
            - name: HITL_APPROVAL_TIMEOUT_SEC
              value: "1800"
            - name: HITL_POLL_INTERVAL_SEC
              value: "10"
            - name: HITL_MAX_CONCURRENT
              value: "32"
            - name: HITL_API_REGISTER_MAX_RETRIES
              value: "5"
            - name: HITL_API_REGISTER_BACKOFF_BASE_SEC
              value: "1.0"
            - name: HITL_DISPATCHER_GROUP
              value: "omni-hitl-dispatcher"
          resources:
            requests:
              cpu: 25m       # polling is I/O-bound; CPU is negligible
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          # Process-level liveness: if the main thread dies, pod restarts.
          # No HTTP server in dispatcher — use exec probe on import check.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import workers.hitl_dispatcher; print('ok')"
            initialDelaySeconds: 15
            periodSeconds: 60
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import workers.hitl_dispatcher; print('ok')"
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 2
            timeoutSeconds: 8
---
# PodDisruptionBudget — ensure rolling updates never drop the only dispatcher instance.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omni-hitl-dispatcher-pdb
  namespace: multi-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: omni-hitl-dispatcher
---
# NetworkPolicy — egress-only to Kafka (9092), Redis (6379), FinGuard HITL API (8081).
# No ingress required: dispatcher is a pure consumer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omni-hitl-dispatcher-netpol
  namespace: multi-agent
spec:
  podSelector:
    matchLabels:
      app: omni-hitl-dispatcher
  policyTypes:
    - Ingress
    - Egress
  ingress: []    # no ingress
  egress:
    # Kafka
    - ports:
        - port: 9092
          protocol: TCP
    # Omni Redis (same namespace)
    - ports:
        - port: 6379
          protocol: TCP
    # FinGuard HITL API (cross-namespace service DNS — port 8081)
    - ports:
        - port: 8081
          protocol: TCP
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
# Secret is managed out-of-band (kubectl create secret / sealed-secret / external-secrets).
# DO NOT add a Secret document here — applying this manifest must never overwrite a live token.
# Bootstrap command (first-time only):
#   kubectl create secret generic hitl-dispatcher-secret \
#     --from-literal=hitl_api_token="<token>" \
#     -n multi-agent
