# Placeholder Telegram credentials — consumed by omni-fullstack and
# omni-onboarding (WorkerSettings.OMNI_TELEGRAM_ADMIN_CHAT_ID is a pydantic int
# field, so chat-id must stay a valid integer even when Telegram is disabled;
# unlike grafana-telegram-alerting-secret.yaml this CANNOT use a non-numeric
# __REQUIRED__ placeholder or the worker crashes at startup).
# Replace before relying on Telegram notifications:
#   kubectl create secret generic telegram-bot -n multi-agent \
#     --from-literal=bot-token='...' --from-literal=chat-id='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
# Pairs with OMNI_TELEGRAM_ENABLED in the ConfigMap — kept "false" until real
# credentials are set here.
apiVersion: v1
kind: Secret
metadata:
  name: telegram-bot
  namespace: multi-agent
  labels:
    app: omni-worker
type: Opaque
stringData:
  bot-token: ""
  chat-id: "0"
