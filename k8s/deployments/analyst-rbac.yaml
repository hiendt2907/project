# Analyst: reasoning/evidence consumer — no cluster-admin (kubectl from pod is unprivileged).
# Post-mutate SDK verify re-runs the same probes as the prober (read-only); needs the same
# namespace + cluster read rules as omni-prober (see prober-rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-analyst
  namespace: multi-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-analyst-uses-prober-read
  namespace: multi-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omni-prober-read
subjects:
  - kind: ServiceAccount
    name: omni-analyst
    namespace: multi-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omni-analyst-security-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omni-prober-security-read
subjects:
  - kind: ServiceAccount
    name: omni-analyst
    namespace: multi-agent
