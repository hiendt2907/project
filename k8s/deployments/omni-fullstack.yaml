# Omni Fullstack — OMNI_WORKER_ROLE=full runs all loops in a single pod.
# Replaces: omni-analyst + omni-prober + omni-core + omni-executor (lab).
# omni-gateway stays separate (own image + scale profile).
#
# Prerequisites:
#   make docker-worker            # bake source into image first
#   kubectl apply -f k8s/deployments/omni-fullstack-rbac.yaml
#
# Migration:
#   make deploy-fullstack         # this manifest + RBAC
#   make scale-down-split         # scale split roles to 0 after fullstack is Running
#
# Rollback:
#   make rollback-fullstack
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-fullstack
  namespace: multi-agent
  labels:
    app: omni-fullstack
    app.kubernetes.io/name: omni-fullstack
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
    omni.io/criticality: "P1"
    omni.io/env: lab
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: omni-fullstack
  template:
    metadata:
      labels:
        app: omni-fullstack
        app.kubernetes.io/name: omni-fullstack
        app.kubernetes.io/part-of: omni-platform
        omni.io/managed: "true"
        omni.io/criticality: "P1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      hostPID: true
      serviceAccountName: omni-fullstack
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0
        fsGroup: 10001
      containers:
        - name: omni-fullstack
          image: 10.43.239.205/library/multi-agent-system:bae5c68
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: omni-worker-config
          env:
            - name: OMNI_WORKER_ROLE
              value: "full"
            # SIEM graph-correlation engine (Python port của brain-go, chạy
            # in-process — loop kafka_siem_correlation_loop). CHỈ được bật khi
            # Deployment omni-brain-go KHÔNG còn chạy: 2 engine cùng bật sẽ
            # đua trên cùng Redis key `corr:*` và double-emit chains (xem
            # review 2026-07-22). brain-go đã xoá cùng commit này sau khi
            # parity test PASS 2/2.
            - name: OMNI_SIEM_CORRELATION_ENABLED
              value: "true"
            - name: OMNI_OTEL_TRACING_ENABLED
              value: "true"
            - name: OMNI_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitor.svc.cluster.local:4317"
            - name: OMNI_OTEL_SERVICE_NAME
              value: "omni-fullstack"
            - name: OMNI_EXECUTOR_FORCE_NSENTER
              value: "true"
            # ── Tự khắc phục KHÔNG cần người duyệt (Đ52, 2026-08-11) ──────────
            # Bật theo quyết định trực tiếp của chủ hệ thống. Trước đó GCP chưa
            # từng bật: đo thật 2026-08-11 cho thấy Omni chẩn đúng `payment-api`
            # bị SIGTERM (confidence 0.9) và ĐÃ muốn tự chữa, nhưng dừng ở
            # `auto_recovery_skipped reason=agent_not_in_lab_allowlist` — chuỗi
            # evidence→chẩn đoán→phương án chạy đủ, chỉ đứt đúng chặng thực thi.
            #
            # ConfigMap `omni-worker-config` CỐ Ý giữ nguyên "false" (mặc định
            # fail-closed): một cluster dựng lại từ ConfigMap mà thiếu file này
            # phải câm chứ không được tự ý mutate. Override chỉ sống ở đây.
            #
            # Bán kính nổ được chặn ĐỘC LẬP ở hai tầng, cố ý không gộp:
            #   1. Omni chọn AGENT  — allowlist ngay dưới, chỉ 3 VM lab.
            #   2. VM  chọn UNIT   — `AOIP_ALLOWED_SYSTEMD_UNITS` trong run.env
            #      trên từng máy (hiện: payment-api.service, systemd-journald).
            # Kể cả khi allowlist dưới đây bị mở nhầm toàn bộ, agent vẫn từ chối
            # mọi unit ngoài danh sách của chính nó.
            # Cộng thêm: ngưỡng confidence tối thiểu (`min_dispatch_confidence`)
            # và CRAT fail-closed vẫn chặn trước khi bất kỳ lệnh nào chạy.
            - name: OMNI_AUTO_EXECUTE_ENABLED
              value: "true"
            # Tên agent = "<tenant>_<host>". Tenant đổi staging-sim → loyalty-uat
            # ngày 2026-08-11, nên danh sách cũ trong CLAUDE.md (staging-sim_*)
            # đã VÔ HIỆU — đó chính là lý do allowlist trượt ở lần đo trên.
            - name: OMNI_LAB_AUTO_EXECUTE_AGENTS
              value: "loyalty-uat_cust-app,loyalty-uat_cust-db,loyalty-uat_cust-edge"
            - name: OMNI_AUDIT_PRIVATE_KEY_PATH
              value: /etc/omni/audit/private_key.pem
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: bot-token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: chat-id
            - name: OMNI_TELEGRAM_ADMIN_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: chat-id
            - name: OMNI_CHAOS_PG_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omni-chaos-lab
                  key: pg-app-password
            - name: OMNI_ADMIN_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: omni-pg-secret
                  key: OMNI_ADMIN_PG_DSN
            - name: OMNI_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omni-gateway-secret
                  key: OMNI_GATEWAY_API_KEY
                  optional: true
            # Đ58 (2026-08-13): MacBook (Ollama host) tắt — chuyển LLM sang NVIDIA
            # NIM (hosted, OpenAI-compat). Key qua Vault secret/omni-nim-secret,
            # xem k8s/gitops/omni-nim-external-secret.yaml. optional: true để pod
            # vẫn khởi động được nếu ExternalSecret chưa sync kịp (fail-open ở mức
            # boot, KHÔNG phải fail-open ở mức gọi LLM — thiếu key thì openai SDK
            # tự trả lỗi auth khi gọi, không silent).
            - name: OMNI_NIM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omni-nim-secret
                  key: api_key
                  optional: true
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
            seccompProfile:
              type: Unconfined
          resources:
            requests:
              cpu: "500m"
              memory: 1024Mi
            limits:
              cpu: "4"
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: audit-keys
              mountPath: /etc/omni/audit
              readOnly: true
      volumes:
        - name: audit-keys
          secret:
            secretName: omni-audit-keys
            defaultMode: 0400
