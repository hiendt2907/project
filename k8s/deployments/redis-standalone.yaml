# Redis standalone (lab) — Service DNS `redis.multi-agent.svc.cluster.local:6379`
# khớp OMNI_REDIS_URL=redis://redis:6379/0. Không dùng Redis Cluster.
#
# AOF: bền dữ liệu queue/streams trên PVC; everysec = cân durability/latency (mất tối đa ~1s ghi cuối khi crash).
# protected-mode no: chỉ an toàn khi Service ClusterIP nội bộ — không expose Redis ra ngoài cluster.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-standalone-config
  namespace: multi-agent
  labels:
    app: redis
data:
  redis.conf: |
    # Working dir — AOF + RDB preamble files live here (PVC)
    dir /data

    # --- Append Only File (AOF) ---
    appendonly yes
    appendfilename "appendonly.aof"
    appenddirname "appendonlydir"
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-load-truncated yes
    aof-use-rdb-preamble yes

    # Memory — lab; tune theo workload
    # dump.rdb for disaster recovery (every hour if 1+ writes, every 5min if 100+ writes)
    save 3600 1
    save 300 100
    save 60 10000
    dbfilename dump.rdb

    # Vector index + Kafka stream data: 2gb
    maxmemory 2gb
    maxmemory-policy allkeys-lru

    # In-cluster only (ClusterIP). Do not expose Redis publicly with protected-mode no.
    protected-mode no

    # Redis Stack modules (paths valid for redis/redis-stack-server image)
    loadmodule /opt/redis-stack/lib/redisearch.so
    loadmodule /opt/redis-stack/lib/rejson.so
    loadmodule /opt/redis-stack/lib/redistimeseries.so
    loadmodule /opt/redis-stack/lib/redisbloom.so
---
# Headless — bắt buộc cho StatefulSet (stable pod DNS: redis-0.redis-hls.multi-agent.svc.cluster.local)
apiVersion: v1
kind: Service
metadata:
  name: redis-hls
  namespace: multi-agent
  labels:
    app: redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: redis
---
# ClusterIP — app kết nối `redis:6379` (khớp OMNI_REDIS_URL)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: multi-agent
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: multi-agent
  labels:
    app: redis
spec:
  serviceName: redis-hls
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis/redis-stack-server:7.4.0-v3
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /etc/redis/redis.conf
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2.5Gi"
              cpu: "1000m"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: redis-standalone-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
