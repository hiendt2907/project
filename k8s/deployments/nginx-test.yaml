# Lab: alert E2E với pod/deployment thật (multi-agent)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: multi-agent
  labels:
    app: nginx-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
