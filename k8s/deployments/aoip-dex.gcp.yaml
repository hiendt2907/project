# GCP variant of aoip-dex.yaml — real public domain (omnisre.xyz) with a valid
# Let's Encrypt cert instead of the lab's http://dex.ai-agent.local. Per
# INV_PUBLIC_PLANE_ISOLATED (CLAUDE.md / ADR 0001), the lab file's issuer must
# NEVER change; this is a separate object applied only by the GCP pipeline.
#
# config.yaml (client secrets + issuer/connectors) no longer lives here as a
# plaintext ConfigMap — it's rendered by k8s/gitops/aoip-dex-external-secret.yaml
# from Vault (`secret/aoip-dex-secret`) into a K8s Secret named `aoip-dex-secret`,
# mounted below. No staticPasswords either (security sweep 2026-08-04: the old
# ConfigMap shipped 5 test accounts, all sharing password "Password123!",
# including a "Provider owner" role account, live on the public GCP Dex — removed
# entirely rather than rotated, since password-based login isn't actually needed
# here, only the OIDC client-credential flow the portals use).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoip-dex
  namespace: multi-agent
  labels: {app: aoip-dex}
spec:
  replicas: 1
  selector: {matchLabels: {app: aoip-dex}}
  template:
    metadata: {labels: {app: aoip-dex}}
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.39.1
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports: [{containerPort: 5556}]
          volumeMounts:
            - {name: config, mountPath: /etc/dex, readOnly: true}
          readinessProbe:
            httpGet: {path: /dex/.well-known/openid-configuration, port: 5556}
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          secret: {secretName: aoip-dex-secret}
---
apiVersion: v1
kind: Service
metadata:
  name: aoip-dex
  namespace: multi-agent
spec:
  selector: {app: aoip-dex}
  ports: [{name: http, port: 5556, targetPort: 5556}]
