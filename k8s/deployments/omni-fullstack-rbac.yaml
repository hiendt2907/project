# Fullstack SA — aggregates RBAC from analyst, prober, executor, and worker roles.
# Used exclusively by omni-fullstack deployment (OMNI_WORKER_ROLE=full).
#
# ⚠️ Nhãn "lab" xác nhận LỖI THỜI 2026-08-13 (Đ62/Đ64 audit): manifest này KHÔNG có bản
# `.gcp.yaml` song song — cùng một file này đang bind thật trên cả lab OrbStack lẫn cluster
# GCP production. Các annotation/label "lab-only"/"do not bind in prod" bên dưới còn sót từ
# lúc `omni-executor-mutate-lab` chỉ tồn tại ở lab — nay là một ngoại lệ CÓ CHỦ ĐÍCH đã gate
# bằng required_evidence + MUTATE_TOOL_ALLOWLIST (xem CLAUDE.md mục RBAC), không phải thứ cần
# xoá trước khi lên prod. Giữ nguyên nhãn "lab" ở đây từng gây hiểu lầm khi audit bảo mật.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-fullstack
  namespace: multi-agent
  labels:
    app.kubernetes.io/component: omni-fullstack
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
---
# Prober read access in multi-agent namespace (pods, logs, events, configmaps, netpol)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-fullstack-prober-read
  namespace: multi-agent
  labels:
    app.kubernetes.io/component: omni-fullstack
    omni.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omni-prober-read
subjects:
  - kind: ServiceAccount
    name: omni-fullstack
    namespace: multi-agent
---
# Worker pod reader in multi-agent namespace (pods, pods/log, events)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-fullstack-worker-pod-reader
  namespace: multi-agent
  labels:
    app.kubernetes.io/component: omni-fullstack
    omni.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omni-worker-pod-reader
subjects:
  - kind: ServiceAccount
    name: omni-fullstack
    namespace: multi-agent
---
# Cross-namespace architecture visibility (pods, nodes, deployments, services — read-only)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omni-fullstack-temporal-prober
  labels:
    app.kubernetes.io/component: omni-fullstack
    omni.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omni-temporal-prober-role
subjects:
  - kind: ServiceAccount
    name: omni-fullstack
    namespace: multi-agent
---
# Executor mutation rights (deployments patch, configmaps create/patch, secrets patch).
# Tên "-lab" là lịch sử (khối này từng chỉ tồn tại ở lab) — nay bind thật trên CẢ lab lẫn GCP
# production, có chủ đích, gated bằng required_evidence + MUTATE_TOOL_ALLOWLIST (xem
# omni-executor-mutate-lab ClusterRole bên dưới + CLAUDE.md mục RBAC). Không xoá trước prod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omni-fullstack-executor-mutate-lab
  labels:
    app.kubernetes.io/component: omni-fullstack
    omni.io/managed: "true"
  annotations:
    omni.io/note: "Tên có hậu tố -lab vì lý do lịch sử; đang bind thật trên cả lab và GCP production, có chủ đích (xem CLAUDE.md mục RBAC). KHÔNG xoá trước khi lên prod — đã ở trên prod."
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omni-executor-mutate-lab
subjects:
  - kind: ServiceAccount
    name: omni-fullstack
    namespace: multi-agent
---
# `secrets` patch/update tách ra khỏi ClusterRole omni-executor-mutate-lab (2026-08-17, roadmap
# B1) — trước đó `secrets: get/list/watch/patch/update` nằm trong ClusterRole nên đọc/sửa được
# secret ở MỌI namespace (vault/argocd/cicd/Harbor...), không chỉ multi-agent. Ứng dụng đã tự
# giới hạn qua OMNI_AUTONOMOUS_ALLOWED_NAMESPACES=multi-agent nên năng lực thật KHÔNG đổi — đây
# chỉ là gỡ lớp phòng thủ RBAC thừa đang mở rộng hơn nhu cầu, không phải thu hẹp chức năng.
# Verify trước khi merge: audit `Forbidden` trong log 48h sau khi apply — nếu có dòng nào request
# secrets ngoài namespace multi-agent bị chặn, đó là chỗ cần điều tra riêng, không tự nới lại.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omni-executor-secrets
  namespace: multi-agent
  labels:
    app.kubernetes.io/component: omni-fullstack
    omni.io/managed: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-fullstack-executor-secrets
  namespace: multi-agent
  labels:
    app.kubernetes.io/component: omni-fullstack
    omni.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omni-executor-secrets
subjects:
  - kind: ServiceAccount
    name: omni-fullstack
    namespace: multi-agent
---
# Node metrics read (metrics.k8s.io/nodes, cluster-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omni-fullstack-metrics-nodes-reader
  labels:
    app.kubernetes.io/component: omni-fullstack
    omni.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omni-worker-metrics-nodes-reader
subjects:
  - kind: ServiceAccount
    name: omni-fullstack
    namespace: multi-agent
---
# Security drift probe (get clusterrolebinding omni-worker-cluster-admin)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omni-fullstack-security-read
  labels:
    app.kubernetes.io/component: omni-fullstack
    omni.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omni-prober-security-read
subjects:
  - kind: ServiceAccount
    name: omni-fullstack
    namespace: multi-agent
---
# ============================================================================
# Role / ClusterRole DEFINITIONS (2026-06-03 consolidation)
# Inlined from the now-deleted split-role RBAC files (prober-rbac.yaml,
# omni-worker-rbac.yaml, executor-rbac-lab.yaml). omni-fullstack is the sole
# worker SA; the bindings above reference these definitions.
# ============================================================================
---
# (was prober-rbac.yaml) read-only Pods/logs/events/configmaps in multi-agent
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omni-prober-read
  namespace: multi-agent
  labels:
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
# (was prober-rbac.yaml) security drift probe — get one named clusterrolebinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omni-prober-security-read
  labels:
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["omni-worker-cluster-admin"]
    verbs: ["get"]
---
# (was omni-worker-rbac.yaml) worker pod reader in multi-agent
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omni-worker-pod-reader
  namespace: multi-agent
  labels:
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# (was omni-worker-rbac.yaml) cross-namespace architecture visibility — read-only, NO secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omni-temporal-prober-role
  labels:
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - nodes
      - nodes/status
      - namespaces
      - services
      - endpoints
      - persistentvolumes
      - persistentvolumeclaims
      - events
      - resourcequotas
      - limitranges
      - configmaps
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
# (was omni-worker-rbac.yaml) cluster-scoped node metrics reader
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omni-worker-metrics-nodes-reader
  labels:
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
# (was executor-rbac-lab.yaml) Executor mutation rights — cluster-wide workload mutation for
# cross-namespace remediation. Only the `rbac.authorization.k8s.io` group below is READ-ONLY
# (2026-06-03 audit S1: write verbs removed there to prevent self-escalation to cluster-admin).
# `secrets` patch/update IS intentionally granted — it backs the gated `k8s_patch_secret`
# mutate tool (src/workers/k8s_cluster_tools.py,
# required_evidence=["secret_ref_confirmed","credential_source_of_truth"], part of
# MUTATE_TOOL_ALLOWLIST) used for credential rotation during SIEM/security remediation. Do
# not narrow this without checking analyst_agentic_loop.py's security-remediation flow first
# (2026-07-03 tech-debt sweep: corrected this comment, which previously read "RBAC resources
# are READ-ONLY" for the whole ClusterRole — that was inaccurate for `secrets`/`configmaps`).
#
# ⚠️ Tên "-lab" + comment "delete before prod" là LỊCH SỬ, không còn đúng từ khi manifest này
# hợp nhất thành nguồn duy nhất cho cả lab và GCP (không có bản `.gcp.yaml` riêng) — ClusterRole
# này đang bind thật trên production, có chủ đích, đã gate đủ (xem trên). Xác nhận lại 2026-08-13
# (Đ62/Đ64/Đ68): quyết định giữ nguyên tên (đổi tên là breaking change cho binding + mọi chỗ
# tham chiếu `omni-executor-mutate-lab`, rủi ro cao hơn lợi ích của việc đổi tên) — chỉ sửa nhãn/
# annotation cho khớp sự thật, không tách file GCP riêng (việc đó cần rà lại toàn bộ đường sync
# ArgoCD `directory.include`, để lại làm sau nếu thực sự cần).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omni-executor-mutate-lab
  labels:
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
  annotations:
    omni.io/note: "Tên có hậu tố -lab vì lý do lịch sử; đang bind thật trên cả lab và GCP production, có chủ đích, đã gate bằng required_evidence + MUTATE_TOOL_ALLOWLIST (xem CLAUDE.md mục RBAC). KHÔNG xoá trước khi lên prod — đã ở trên prod."
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "events", "services", "endpoints", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # `secrets` gỡ khỏi ClusterRole 2026-08-17 (roadmap B1) — chuyển sang Role namespace-scoped
  # `omni-executor-secrets` (namespace multi-agent) ngay phía trên ClusterRoleBinding
  # omni-fullstack-executor-mutate-lab trong file này. Trước đó rule này cho phép đọc/sửa secrets
  # ở MỌI namespace cluster-wide dù ứng dụng chỉ thật sự cần trong multi-agent
  # (OMNI_AUTONOMOUS_ALLOWED_NAMESPACES=multi-agent).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
