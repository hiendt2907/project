# Omni Ingress Gateway — image riêng `omni-gateway:latest` (không dùng multi-agent-system).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-gateway
  namespace: multi-agent
  labels:
    app: omni-gateway
    app.kubernetes.io/name: omni-gateway
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
    omni.io/criticality: "P1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omni-gateway
  template:
    metadata:
      labels:
        app: omni-gateway
        app.kubernetes.io/name: omni-gateway
        app.kubernetes.io/part-of: omni-platform
        omni.io/managed: "true"
        omni.io/criticality: "P1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: omni-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "gateway.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: omni-worker-config
            - secretRef:
                name: omni-gateway-secret
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: omni-gateway
  namespace: multi-agent
spec:
  selector:
    app: omni-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omni-gateway-netpol
  namespace: multi-agent
spec:
  podSelector:
    matchLabels:
      app: omni-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
