# Omni Ingress Gateway — image riêng `omni-gateway:latest` (không dùng multi-agent-system).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-gateway
  namespace: multi-agent
  labels:
    app: omni-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omni-gateway
  template:
    metadata:
      labels:
        app: omni-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: omni-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "gateway.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: omni-worker-config
---
apiVersion: v1
kind: Service
metadata:
  name: omni-gateway
  namespace: multi-agent
spec:
  selector:
    app: omni-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
