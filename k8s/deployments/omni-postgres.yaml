# omni-postgres — PostgreSQL 18 (source-of-truth cho Admin config schema omni_admin).
# Namespace: multi-agent. Thay thế CloudNativePG (cnpg) đã gỡ.
# DSN: postgresql://omni:<pass>@omni-postgres.multi-agent.svc.cluster.local:5432/omnidb
#
# SECURITY SWEEP 2026-08-04: omni-pg-secret KHÔNG còn manifest ở đây — trước đó
# POSTGRES_PASSWORD/OMNI_ADMIN_PG_DSN bị commit thẳng plaintext vào git (rotate xong,
# giá trị cũ đã vô hiệu). Secret giờ bootstrap-once trong Jenkinsfile (cùng pattern
# harbor-admin-bootstrap/grafana-admin — random qua `openssl rand`, tạo nếu chưa có,
# không rotate mỗi lần build). Rotate thủ công cần: tạo password mới → `kubectl exec
# omni-postgres-0 -- psql -U omni -d omnidb -c "ALTER USER omni WITH PASSWORD '...'"`
# (đổi password thật trong Postgres — patch riêng Secret không tự đổi được vì
# POSTGRES_PASSWORD chỉ đọc lúc init container, dữ liệu đã init rồi thì bị bỏ qua) →
# patch Secret omni-pg-secret (POSTGRES_PASSWORD + OMNI_ADMIN_PG_DSN) → restart mọi
# consumer đọc OMNI_ADMIN_PG_DSN (omni-gateway, omni-fullstack, omni-onboarding,
# aoip-provider-portal, aoip-tenant-portal) → xác nhận /readyz.
# Apply: kubectl apply -f k8s/deployments/omni-postgres.yaml (StatefulSet/Service —
# Secret riêng, xem Jenkinsfile stage "Apply manifests").
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: omni-postgres
  namespace: multi-agent
  labels:
    app: omni-postgres
spec:
  serviceName: omni-postgres
  replicas: 1
  selector:
    matchLabels:
      app: omni-postgres
  template:
    metadata:
      labels:
        app: omni-postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: omni-pg-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omni-pg-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: omni-pg-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "omni", "-d", "omnidb"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "omni", "-d", "omnidb"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: omni-postgres
  namespace: multi-agent
  labels:
    app: omni-postgres
spec:
  type: ClusterIP
  selector:
    app: omni-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
