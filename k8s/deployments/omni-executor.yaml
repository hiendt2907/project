# Executor: consumes omni-actions only — mutations via pkg.executor (Master Plan V3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-executor
  namespace: multi-agent
  labels:
    app: omni-executor
    app.kubernetes.io/name: omni-executor
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
    omni.io/criticality: "P1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omni-executor
  template:
    metadata:
      labels:
        app: omni-executor
        app.kubernetes.io/name: omni-executor
        app.kubernetes.io/part-of: omni-platform
        omni.io/managed: "true"
        omni.io/criticality: "P1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      hostPID: true
      serviceAccountName: omni-executor
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10001
      containers:
        - name: omni-executor
          image: multi-agent-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: omni-worker-config
          env:
            - name: OMNI_WORKER_ROLE
              value: "executor"
            - name: OMNI_EXECUTOR_FORCE_NSENTER
              value: "true"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: bot-token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: chat-id
            - name: OMNI_TELEGRAM_ADMIN_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: chat-id
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
            seccompProfile:
              type: Unconfined
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: source-code
              mountPath: /app/src
      volumes:
        - name: source-code
          hostPath:
            path: /Users/hiendang/project/src
            type: Directory
