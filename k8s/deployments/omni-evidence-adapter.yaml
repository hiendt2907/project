---
# ServiceAccount: evidence-adapter needs no K8s API permissions.
# It reads from Smart-SIEM Redis streams and writes to Omni Kafka only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-evidence-adapter
  namespace: multi-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-evidence-adapter
  namespace: multi-agent
  labels:
    app: omni-evidence-adapter
    app.kubernetes.io/component: evidence-adapter
    app.kubernetes.io/part-of: omni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omni-evidence-adapter
  template:
    metadata:
      labels:
        app: omni-evidence-adapter
    spec:
      serviceAccountName: omni-evidence-adapter
      restartPolicy: Always
      containers:
        - name: evidence-adapter
          image: multi-agent-system:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.evidence_adapter.worker"]
          env:
            # --- Smart-SIEM Redis (cross-namespace DNS) ---
            - name: ADAPTER_REDIS_URL
              value: "redis://redis.finguard-customer.svc.cluster.local:6379"
            - name: ADAPTER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finguard-redis-bridge-secret
                  key: password
            - name: ADAPTER_STREAM
              value: "stream:siem_evidence_raw"
            - name: ADAPTER_GROUP
              value: "omni-evidence-adapters"
            - name: ADAPTER_CONSUMER
              value: "omni-evidence-adapter-1"
            - name: ADAPTER_BLOCK_MS
              value: "2000"
            - name: ADAPTER_BATCH
              value: "10"
            # --- Omni Kafka (same namespace) ---
            - name: OMNI_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: OMNI_KAFKA_TOPIC_EVIDENCE
              value: "omni-diagnostic-evidence"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
