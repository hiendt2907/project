# Omni-worker SA: least-privilege read-only access.
# Mutations are the executor's responsibility (executor-rbac-lab.yaml / rbac-executor-least-privilege.yaml).
# cluster-admin binding removed — invariant: NEVER cluster-admin on any SRE automation SA.
---
# RBAC đọc Pod trong namespace multi-agent (omni-worker tool k8s_list_pods) — bổ sung; cluster-admin đã bao phủ.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-worker
  namespace: multi-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omni-worker-pod-reader
  namespace: multi-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # read_namespaced_pod_log — thiếu quyền này → 403 Forbidden
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-worker-pod-reader
  namespace: multi-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omni-worker-pod-reader
subjects:
  - kind: ServiceAccount
    name: omni-worker
    namespace: multi-agent
---
# Temporal Prober: cross-namespace architecture visibility.
# Secrets intentionally excluded — read access to secrets = credential exposure vector.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omni-temporal-prober-role
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - nodes
      - nodes/status
      - namespaces
      - services
      - endpoints
      - persistentvolumes
      - persistentvolumeclaims
      - events
      - resourcequotas
      - limitranges
      - configmaps
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omni-temporal-prober-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omni-temporal-prober-role
subjects:
  - kind: ServiceAccount
    name: omni-worker
    namespace: multi-agent
---
# metrics.k8s.io/nodes là cluster-scoped — cần ClusterRole (OrbStack/metrics-server).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omni-worker-metrics-nodes-reader
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omni-worker-metrics-nodes-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omni-worker-metrics-nodes-reader
subjects:
  - kind: ServiceAccount
    name: omni-worker
    namespace: multi-agent
