            httpGet: {path: /, port: 8082}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /assets/shell.css, port: 8082}
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            tcpSocket: {port: 8082}
            failureThreshold: 30
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: aoip-tenant-portal, namespace: multi-agent}
spec:
  selector: {app: aoip-tenant-portal}
  ports: [{name: http, port: 8082, targetPort: 8082}]
