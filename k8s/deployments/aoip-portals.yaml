            - {name: AOIP_OIDC_TENANT_CLIENT_SECRET, value: "tenant-portal-secret"}
            - {name: AOIP_OIDC_TENANT_AUTHORIZE_URL, value: "http://dex.ai-agent.local/dex/auth"}
            - {name: AOIP_OIDC_TENANT_TOKEN_URL, value: "http://aoip-dex:5556/dex/token"}
