# AOIP hai portal production — backend LÀ auth authority + origin của mỗi portal.
# Image multi-agent-system:latest (make docker-worker). Redis + Postgres omni_admin dùng
# lại hạ tầng cluster (svc `redis`, `omni-postgres` / secret omni-pg-secret).
# Lifespan server.py: migrate omni_admin (0004 portal identity) + hydrate PG→Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoip-provider-portal
  namespace: multi-agent
  labels: {app: aoip-provider-portal}
spec:
  replicas: 1
  selector: {matchLabels: {app: aoip-provider-portal}}
  template:
    metadata: {labels: {app: aoip-provider-portal}}
    spec:
      containers:
        - name: portal
          image: multi-agent-system:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "aoip.console.server:provider_app", "--host", "0.0.0.0", "--port", "8081"]
          ports: [{containerPort: 8081}]
          env:
            - {name: OMNI_REDIS_URL, value: "redis://redis:6379/0"}
            - name: OMNI_ADMIN_PG_DSN
              valueFrom: {secretKeyRef: {name: omni-pg-secret, key: OMNI_ADMIN_PG_DSN}}
            - {name: AOIP_PROVIDER_ORIGINS, value: "http://provider.ai-agent.local"}
            - {name: AOIP_OIDC_PROVIDER_ISSUER, value: "http://dex.ai-agent.local/dex"}
            - {name: AOIP_OIDC_PROVIDER_CLIENT_ID, value: "aoip-provider-portal"}
            - {name: AOIP_OIDC_PROVIDER_CLIENT_SECRET, value: "provider-portal-secret"}
            - {name: AOIP_OIDC_PROVIDER_AUTHORIZE_URL, value: "http://dex.ai-agent.local/dex/auth"}
            - {name: AOIP_OIDC_PROVIDER_TOKEN_URL, value: "http://aoip-dex:5556/dex/token"}
            - {name: AOIP_OIDC_PROVIDER_JWKS_URL, value: "http://aoip-dex:5556/dex/keys"}
            - {name: AOIP_OIDC_PROVIDER_REDIRECT_URI, value: "http://provider.ai-agent.local/auth/callback"}
          readinessProbe:
            httpGet: {path: /, port: 8081}   # shell trả 200; /me trả 401 (đúng) nên không dùng làm probe
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /assets/shell.css, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            tcpSocket: {port: 8081}
            failureThreshold: 30
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: aoip-provider-portal, namespace: multi-agent}
spec:
  selector: {app: aoip-provider-portal}
  ports: [{name: http, port: 8081, targetPort: 8081}]
---
