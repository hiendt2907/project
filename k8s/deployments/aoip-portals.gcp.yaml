            - {name: AOIP_OIDC_TENANT_JWKS_URL, value: "http://aoip-dex:5556/dex/keys"}
            - {name: AOIP_OIDC_TENANT_REDIRECT_URI, value: "https://tenant.omnisre.xyz/auth/callback"}
          readinessProbe:
            httpGet: {path: /, port: 8082}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /assets/shell.css, port: 8082}
            initialDelaySeconds: 15
