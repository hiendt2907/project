      containers:
        - name: portal
          image: 10.43.239.205/library/multi-agent-system:e2afaf7
          imagePullPolicy: Always
          command: ["uvicorn", "aoip.console.server:tenant_app", "--host", "0.0.0.0", "--port", "8082"]
          ports: [{containerPort: 8082}]
