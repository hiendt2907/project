            - name: AOIP_OIDC_TENANT_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: aoip-dex-secret, key: tenant_secret}}
            - {name: AOIP_OIDC_TENANT_AUTHORIZE_URL, value: "https://dex.omnisre.xyz/dex/auth"}
