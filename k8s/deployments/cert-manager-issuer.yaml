# Let's Encrypt HTTP-01 ClusterIssuer for the GCP single-node k3s cluster.
# Uses the k3s-bundled Traefik ingress class (default) — no separate ingress
# controller install needed. Requires port 80 reachable from the internet for
# the HTTP-01 challenge (VM firewall tags http-server/https-server, DNS
# records must be "DNS only" / gray-cloud, not Cloudflare-proxied).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: danghien2907@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
