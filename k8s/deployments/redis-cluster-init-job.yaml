apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-bootstrapper
  namespace: multi-agent
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      containers:
      - name: bootstrapper
        image: redis:7.4-alpine
        command:
        - /bin/sh
        - -c
        - |
          # 1. Chờ cho 6 pod Ready (IP-based lookup)
          IPs=""
          while [ $(echo $IPs | wc -w) -lt 6 ]; do
            echo "Waiting for 6 nodes to be reachable..."
            IPs=$(nslookup redis-cluster-headless.multi-agent.svc.cluster.local | grep Address | awk '{print $2}' | grep -v '127.0.0.1')
            sleep 5
          done
          
          # 2. Kiểm tra nếu đã có cluster
          if redis-cli -h redis-cluster-0.redis-cluster-headless cluster info | grep -q "cluster_state:ok"; then
            echo "Cluster already healthy. Skipping."
            exit 0
          fi

          # 3. Tạo cluster (Nuclear Join)
          CLUSTER_NODES=""
          for ip in $IPs; do
            CLUSTER_NODES="$CLUSTER_NODES $ip:6379"
          done
          echo "Bootstrapping nodes: $CLUSTER_NODES"
          redis-cli --cluster create $CLUSTER_NODES --cluster-replicas 1 --cluster-yes
      restartPolicy: OnFailure
