apiVersion: v1
kind: Secret
metadata:
  name: omni-ui-secrets
  namespace: multi-agent
type: Opaque
stringData:
  NEXTAUTH_SECRET: "change-me-omni-ui-secret-32chars-min"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "omni-admin-2024"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-ui
  namespace: multi-agent
  labels:
    app: omni-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omni-ui
  template:
    metadata:
      labels:
        app: omni-ui
    spec:
      containers:
        - name: omni-ui
          image: omni-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXTAUTH_URL
              value: "http://omni.ai-agent.local"
            - name: SIEM_METRICS_URL
              value: "http://prometheus.monitor.svc.cluster.local:9090/api/v1/query"
            - name: OMNI_GATEWAY_URL
              value: "http://omni-gateway.multi-agent.svc.cluster.local"
            - name: OMNI_REDIS_URL
              value: "redis://redis.multi-agent.svc.cluster.local:6379"
          envFrom:
            - secretRef:
                name: omni-ui-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: omni-ui
  namespace: multi-agent
  labels:
    app: omni-ui
spec:
  type: ClusterIP
  selector:
    app: omni-ui
  ports:
    - port: 80
      targetPort: 3000
      name: http
