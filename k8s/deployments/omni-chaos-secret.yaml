# Secret for OrbStack chaos-victim lab password.
# Apply: ./scripts/with_working_kube.sh apply -f k8s/deployments/omni-chaos-secret.yaml
# DO NOT commit real passwords — populate via:
#   kubectl create secret generic omni-chaos-lab \
#     --from-literal=pg-app-password=<real-password> \
#     -n multi-agent --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: omni-chaos-lab
  namespace: multi-agent
  labels:
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
    omni.io/sensitivity: "lab-only"
type: Opaque
stringData:
  pg-app-password: "chaos-app-pass-2025"
