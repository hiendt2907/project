# URL Prometheus + proactive + autonomous forecast + baseline snapshot (Omni móc TSDB).
# Chỉnh rồi rollout: ./scripts/with_working_kube.sh apply -f k8s/deployments/omni-worker-configmap.yaml
#
# M4 nhẹ tạm thời: giữ `OMNI_OLLAMA_NUM_PARALLEL` khớp Ollama host (`OLLAMA_NUM_PARALLEL` trong
# ~/.ollama/env hoặc launchctl) — lệch slot Redis ↔ Ollama → treo/timeout. Muốn “full speed”
# đặt lại parallel=2, interval ngắn hơn, bật lại OTEL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: omni-worker-config
  namespace: multi-agent
  labels:
    app: omni-worker
data:
  OMNI_OOM_DETERMINISTIC_REMEDIATE_ENABLED: "false"
  # Lab: deterministic OOM memory patch (requires alert labels + flag)
  OMNI_PROMETHEUS_URL: "prometheus.monitor.svc.cluster.local:9090"
  OMNI_VMAGENT_URL: "prometheus.monitor.svc.cluster.local:9090"
  # Autonomous forecast (Prophet / fallback → Telegram khi vượt ngưỡng). 1h/lần để nhẹ M4.
  OMNI_AUTONOMOUS_FORECAST_ENABLED: "true"
  OMNI_AUTONOMOUS_FORECAST_INTERVAL_SEC: "3600"
  # Trend node: CPU busy (0–1). Muốn memory trend riêng cần bản mở rộng multi-series forecast.
  OMNI_AUTONOMOUS_FORECAST_PROMQL: 'avg(rate(node_cpu_seconds_total{mode!="idle"}[5m]))'
  OMNI_AUTONOMOUS_FORECAST_THRESHOLD: "0.95"
  OMNI_AUTONOMOUS_FORECAST_DURATION: "24h"
  OMNI_AUTONOMOUS_FORECAST_ALERT_COOLDOWN_SEC: "3600"
  # Proactive: instant scalar > threshold → incidents:proactive (điều chỉnh theo lab)
  OMNI_PROACTIVE_PROMQL: 'sum(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"})'
  OMNI_PROACTIVE_TRIGGER_THRESHOLD: "0"
  OMNI_PROACTIVE_EVAL_INTERVAL_SEC: "300"
  # Baseline: multi instant query → Redis omni:baseline:snapshot (interval bên dưới; TTL 10 phút)
  OMNI_BASELINE_SNAPSHOT_ENABLED: "true"
  OMNI_BASELINE_SNAPSHOT_INTERVAL_SEC: "600"
  OMNI_BASELINE_SNAPSHOT_REDIS_TTL_SEC: "600"
  # Manifest đa chiều (cpu/mem/net/dsk/rp/evt/dr) — built-in PromQL; tuỳ chọn thêm q qua OMNI_BASELINE_PROMQL
  OMNI_BASELINE_MANIFEST_MAX_CHARS: "1400"
  OMNI_BASELINE_SYSTEM_PROMPT_MAX_CHARS: "1600"
  # 3-Sigma dr: |z_cpu| hoặc |z_mem| > ngưỡng (recording rules trong Prometheus)
  OMNI_BASELINE_DR_Z_THRESHOLD: "3.0"
  OMNI_BASELINE_PROMQL_Z_CPU: "omni:node_cpu:z"
  OMNI_BASELINE_PROMQL_Z_MEM: "omni:mem:z"
  OMNI_BASELINE_PROMQL_Z_DISK: "omni:node_disk:z"
  OMNI_BASELINE_PROMQL_Z_NET: ""
  OMNI_BASELINE_PROMQL_SEASONAL_CPU: "omni:health:cpu_seasonal_drift_z"
  OMNI_CHS_WEIGHTS: '{"cpu":0.25,"mem":0.25,"disk":0.25,"net":0.25}'
  OMNI_CHS_THRESHOLD: "10"
  OMNI_GOLDEN_LATENCY_PROMQL: ""
  OMNI_LATENCY_THRESHOLD_MS: ""
  OMNI_BASELINE_LEGACY_CPU_DRIFT_FOR_DR: "false"
  OMNI_BASELINE_CPU_DRIFT_THRESHOLD: "0.15"
  # Thêm name|instant_promql (tối đa vài dòng) → key q trong JSON; để trống = chỉ built-in
  OMNI_BASELINE_PROMQL: ""
  OMNI_BASELINE_SNAPSHOT_MAX_CHARS: "1800"
  # Production governance: no god/lab bypass (OMNI_GOD_MODE ignored when OMNI_ENV_MODE=prod in code)
  OMNI_GOD_MODE: "false"
  # Autonomous Decider (tắt mặc định — bật khi đã có Prometheus + baseline ổn)
  OMNI_AUTONOMOUS_DECIDER_ENABLED: "false"
  OMNI_AUTONOMOUS_DECIDER_INTERVAL_SEC: "300"
  OMNI_AUTONOMOUS_FIX_COOLDOWN_SEC: "600"
  OMNI_AUTONOMOUS_SAFE_TOOLS: "k8s_rollout_restart,redis_health,redis_expert_check,sandbox_cleanup"
  OMNI_AUTONOMOUS_ALLOWED_NAMESPACES: "multi-agent"
  # Phase 5 — Strict Advisory Mode: fail-closed at infra level.
  # OMNI_AUTO_EXECUTE_ENABLED=false prevents ALL autonomous mutations.
  # All SIEM incidents emit SUGGEST_REMEDIATION + Telegram only (no EXECUTE_MUTATE, no HITL pipeline).
  # To re-enable execution, this ConfigMap must be edited AND redeployed — LLM cannot override this.
  OMNI_AUTO_EXECUTE_ENABLED: "false"
  OMNI_SIEM_SUGGEST_ONLY: "true"
  # Advisory Mode: autonomous rollout disabled — all actions are suggestions only.
  OMNI_AUTONOMOUS_ROLLOUT_ON_FAULT_INCIDENT: "false"
  # In-cluster service URLs & worker runtime (non-secret — override per cluster via ConfigMap)
  OMNI_REDIS_URL: "redis://redis:6379/0"
  OMNI_REDIS_CLUSTER: "false"
  OMNI_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  OMNI_ENV_MODE: "prod"
  # OrbStack chaos-victim inject: password sourced from Secret omni-chaos-lab (see omni-chaos-secret.yaml).
  OMNI_LAB_CHAOS_CREDENTIAL_AUTOFIX_ENABLED: "true"
  # omni-worker no longer bound to cluster-admin — least-privilege RBAC enforced (see omni-worker-rbac.yaml).
  OMNI_CLUSTER_FULL_ACCESS: "false"
  # Planner-led autonomy (skip deterministic mutate shortcuts; pair with OMNI_LEGACY_DETERMINISTIC_FALLBACK=false)
  OMNI_LLM_FIRST_AUTONOMY_ENABLED: "true"
  OMNI_LEGACY_DETERMINISTIC_FALLBACK: "false"
  # Ollama on macOS host (Apple Silicon GPU) — OrbStack DNS routes K8s pods → host.
  OMNI_VLLM_BASE_URL: "http://host.orb.internal:11434/v1"
  OMNI_VLLM_EMBED_URL: "http://host.orb.internal:11434/v1"
  VLLM_BASE_URL: "http://host.orb.internal:11434/v1"
  VLLM_EMBED_URL: "http://host.orb.internal:11434/v1"
  VLLM_MODEL: "qwen2.5-coder:7b"
  OMNI_LLM_NUM_PARALLEL: "2"
  OMNI_TELEGRAM_ENABLED: "true"
  # Model profile (go-prod baseline on current Ollama inventory)
  # - chat_model: fast/robust interactive + tool JSON
  # - reasoning_engine: diagnosis/planning quality
  # - heavy_lifter: long-context synthesis/compression
  # - helper: JSON repair / lightweight transforms
  # - diag_evidence_llm_model: planner in evidence_consumer (pin to avoid fallback drift)
  # - autonomous_decider_model: autonomous decider loop
  OMNI_CHAT_MODEL: "qwen2.5-coder:7b"
  OMNI_MODEL_REASONING_ENGINE: "qwen2.5-coder:7b"
  OMNI_MODEL_HEAVY_LIFTER: "qwen2.5-coder:7b"
  OMNI_MODEL_HELPER: "qwen2.5-coder:7b"
  OMNI_DIAG_EVIDENCE_LLM_MODEL: "qwen2.5-coder:7b"
  OMNI_AUTONOMOUS_DECIDER_MODEL: "qwen2.5-coder:7b"
  OMNI_EMBED_MODEL: "nomic-embed-text"
  OMNI_DEEP_SCOUT_INTERVAL_SEC: "1800"
  OMNI_METRICS_LISTEN_PORT: "9090"
  OMNI_OPENSANDBOX_ENABLED: "true"
  OMNI_OPENSANDBOX_BASE_URL: "http://opensandbox-shim.opensandbox.svc.cluster.local:8888"
  OMNI_OPENSANDBOX_EXEC_PATH: "/api/v1/execute"
  OMNI_K8S_DEFAULT_NAMESPACE: "multi-agent"
  OMNI_MONITOR_STACK_NAMESPACE: "monitor"
  # Agentic ReAct slow-path + OTLP → Tempo (BatchSpanProcessor trong code)
  OMNI_AGENTIC_SLOW_PATH_ENABLED: "true"
  OMNI_AGENTIC_MAX_LLM_ITERATIONS: "5"
  OMNI_OTEL_TRACING_ENABLED: "false"
  OMNI_OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitor.svc.cluster.local:4317"
  OMNI_OTEL_SERVICE_NAME: "omni-worker"
  # Gateway: do not drop Prometheus chaos-lab test webhooks (lab-only scripts; off for real ingress)
  OMNI_GATEWAY_SILENCE_CHAOS_LAB: "false"
