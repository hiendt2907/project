# One-shot: seed SOP → Ollama embed → Redis Stack HNSW index (COLLECTION_SOP, up to 10k points).
apiVersion: batch/v1
kind: Job
metadata:
  name: sop-ingest
  namespace: multi-agent
spec:
  ttlSecondsAfterFinished: 86400
  # backoffLimit 1→3 (roadmap 2026-08-17, A3): cùng bug Istio webhook race đã sửa cho
  # omni-postgres-backup-cronjob.yaml — job one-shot này chạy tay nên không cần nhiều như
  # CronJob định kỳ, nhưng 1 vẫn quá ít nếu chạy đúng lúc istiod chưa Ready sau reboot.
  backoffLimit: 3
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: omni-worker
      containers:
        - name: sop-ingest
          image: multi-agent-system:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "training.sop_ingest"]
          env:
            - name: PYTHONPATH
              value: /app/src
            - name: OMNI_SOP_SEED_PATH
              value: /app/data/sop/sop_templates.yaml
            - name: OMNI_MAX_SOP_CONTEXTS
              value: "10000"
            - name: OMNI_VLLM_BASE_URL
              value: http://host.orb.internal:11434/v1
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
