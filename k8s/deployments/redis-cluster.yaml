apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-headless
  namespace: multi-agent
  labels:
    app: redis-cluster
spec:
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
    name: client
  - port: 16379
    targetPort: 16379
    name: bus
  # Phải khớp label pod của StatefulSet
  selector:
    app.kubernetes.io/name: redis-cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: multi-agent
spec:
  serviceName: "redis-cluster-headless"
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
        app.kubernetes.io/name: redis-cluster
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        command:
          - "redis-server"
        args:
          - "--cluster-enabled"
          - "yes"
          - "--cluster-config-file"
          - "nodes.conf"
          - "--cluster-node-timeout"
          - "5000"
          - "--appendonly"
          - "yes"
          - "--maxmemory-policy"
          - "allkeys-lru"
          - "--protected-mode"
          - "no"
          - "--cluster-announce-hostname"
          - "$(POD_NAME).redis-cluster-headless.multi-agent.svc.cluster.local"
          - "--cluster-preferred-endpoint-type"
          - "hostname"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 6379
          name: client
        - containerPort: 16379
          name: bus
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi" # Bat buoc gioi han cho OrbStack
            cpu: "100m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: multi-agent
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: cluster-init
        image: redis:7.4-alpine
        command:
          - "sh"
          - "-c"
          - |
            echo "Waiting for all 6 redis pods to be ready..."
            sleep 15
            echo "Initializing redis cluster..."
            redis-cli --cluster create \
              redis-cluster-0.redis-cluster-headless.multi-agent.svc.cluster.local:6379 \
              redis-cluster-1.redis-cluster-headless.multi-agent.svc.cluster.local:6379 \
              redis-cluster-2.redis-cluster-headless.multi-agent.svc.cluster.local:6379 \
              redis-cluster-3.redis-cluster-headless.multi-agent.svc.cluster.local:6379 \
              redis-cluster-4.redis-cluster-headless.multi-agent.svc.cluster.local:6379 \
              redis-cluster-5.redis-cluster-headless.multi-agent.svc.cluster.local:6379 \
              --cluster-replicas 1 \
              --cluster-yes || echo "Cluster initialization complete or already exists."
