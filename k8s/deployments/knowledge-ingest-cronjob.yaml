# Weekly vendor knowledge ingest — image must include src/knowledge + config/
apiVersion: batch/v1
kind: CronJob
metadata:
  name: knowledge-ingest
  namespace: multi-agent
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      # backoffLimit 1→6 (roadmap 2026-08-17, A3): cùng bug Istio webhook race đã sửa cho
      # omni-postgres-backup-cronjob.yaml. Job này chạy hàng tuần — fail vì race thoáng qua
      # nghĩa là mất nguyên 1 tuần chờ lần kế tiếp, cần nhiều retry hơn trong 1 lần chạy.
      backoffLimit: 6
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: omni-worker
          containers:
            - name: knowledge-ingest
              image: multi-agent-system:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "knowledge.ingest_main"]
              env:
                - name: PYTHONPATH
                  value: /app/src
                - name: OMNI_KNOWLEDGE_SOURCES
                  value: /app/config/knowledge_sources.yaml
                - name: OMNI_VLLM_BASE_URL
                  value: http://host.orb.internal:11434/v1
              volumeMounts:
                - name: knowledge-sources
                  mountPath: /app/config/knowledge_sources.yaml
                  subPath: knowledge_sources.yaml
                  readOnly: true
              resources:
                requests:
                  cpu: "250m"
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
          volumes:
            - name: knowledge-sources
              configMap:
                name: knowledge-sources
