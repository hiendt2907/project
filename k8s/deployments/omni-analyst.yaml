# Analyst: consumes omni-diagnostic-evidence only (Master Plan V3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-analyst
  namespace: multi-agent
  labels:
    app: omni-analyst
    app.kubernetes.io/name: omni-analyst
    app.kubernetes.io/part-of: omni-platform
    omni.io/managed: "true"
    omni.io/criticality: "P1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omni-analyst
  template:
    metadata:
      labels:
        app: omni-analyst
        app.kubernetes.io/name: omni-analyst
        app.kubernetes.io/part-of: omni-platform
        omni.io/managed: "true"
        omni.io/criticality: "P1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: omni-analyst
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: omni-analyst
          image: multi-agent-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: omni-worker-config
          env:
            - name: OMNI_WORKER_ROLE
              value: "analyst"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: bot-token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: chat-id
            - name: OMNI_TELEGRAM_ADMIN_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: chat-id
            - name: OMNI_AUDIT_PRIVATE_KEY_PATH
              value: /etc/omni/audit/private_key.pem
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: audit-keys
              mountPath: /etc/omni/audit
              readOnly: true
      volumes:
        - name: audit-keys
          secret:
            secretName: omni-audit-keys
            defaultMode: 0400
