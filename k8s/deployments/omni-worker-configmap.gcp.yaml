# GCP single-node k3s variant of omni-worker-configmap.yaml. Same object
# (name/namespace), applied INSTEAD OF the lab file by Jenkinsfile — kubectl apply
# on a ConfigMap replaces the whole `data` map, so this must stay a full copy,
# not a partial patch. Only difference from the lab file: OMNI_VLLM_BASE_URL /
# OMNI_VLLM_EMBED_URL / VLLM_BASE_URL / VLLM_EMBED_URL / OMNI_CLUSTER_VERSION —
# Ollama stays on the Mac, reached from GCP over Tailscale instead of
# OrbStack's host.orb.internal DNS. Keep in sync with the lab file by hand;
# a Kustomize overlay would remove this duplication if the drift becomes painful.
apiVersion: v1
kind: ConfigMap
metadata:
  name: omni-worker-config
  namespace: multi-agent
  labels:
    app: omni-worker
data:
  OMNI_AGENT_UPDATE_ALLOWED_HOSTS: "gateway.omnisre.xyz"
  OMNI_OOM_DETERMINISTIC_REMEDIATE_ENABLED: "false"
  OMNI_PROMETHEUS_URL: "prometheus.monitor.svc.cluster.local:9090"
  OMNI_VMAGENT_URL: "prometheus.monitor.svc.cluster.local:9090"
  OMNI_AUTONOMOUS_FORECAST_ENABLED: "true"
  OMNI_AUTONOMOUS_FORECAST_INTERVAL_SEC: "3600"
  OMNI_AUTONOMOUS_FORECAST_PROMQL: 'avg(rate(node_cpu_seconds_total{mode!="idle"}[5m]))'
  OMNI_AUTONOMOUS_FORECAST_THRESHOLD: "0.95"
  OMNI_AUTONOMOUS_FORECAST_DURATION: "24h"
  OMNI_AUTONOMOUS_FORECAST_ALERT_COOLDOWN_SEC: "3600"
  # S4 — Điều kiện kích hoạt proactive: từ HẬU QUẢ sang TÍN HIỆU SỚM.
  #
  # Đo tại P1 (docs/audit/PROACTIVE_FREEZE_2026-08-09.md): trong 4,459h vận hành có
  # 26 trace từ alert và ĐÚNG 0 trace proactive. Nguyên nhân không phải thiếu code —
  # 5 vòng proactive đều chạy — mà là điều kiện kích hoạt duy nhất bên dưới
  # (`CrashLoopBackOff > 0`) vốn đã là hậu quả, không phải dấu hiệu sớm.
  # ĐÍNH CHÍNH 2026-08-09 (bản trước ở đây ghi SAI cơ chế): truy vấn đó trả 0 series
  # khi không có pod nào crash-loop, nhưng đó là hành vi ĐÚNG của kube-state-metrics
  # chứ không phải rule chết — đo cùng lúc: `kube_pod_container_status_waiting` có
  # 65 series, KSM `up=1`; họ metric `..._waiting_reason` chỉ sinh series khi thật sự
  # có container đang waiting. Nên khi crashloop xảy ra, rule NÀY VẪN BẮN.
  # Vấn đề thật nằm ở chỗ khác và vẫn là lý do S4: nó chỉ có series SAU KHI crashloop
  # đã thành hình — đo hậu quả, không phải tín hiệu sớm.
  #
  # `OMNI_PROACTIVE_PROMQL`/`_TRIGGER_THRESHOLD` GIỮ NGUYÊN làm lưới cuối và làm
  # đường lùi: `proactive_promql_rules` rỗng hoặc không parse được ⇒ tự rơi về rule
  # đơn này (backward-compat, không breaking).
  OMNI_PROACTIVE_PROMQL: 'sum(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"})'
  OMNI_PROACTIVE_TRIGGER_THRESHOLD: "0"
  OMNI_PROACTIVE_EVAL_INTERVAL_SEC: "300"
  # Bật THEO ĐỢT, không bật cả bộ một lúc. Đợt 1 chỉ gồm rule mà giá trị hiện tại
  # ĐANG BẰNG 0 (đo thật: restart_accel=0, replicas_unavailable=0) — bật lên không
  # bắn ngay, nên quan sát được nhiễu thật trong 24h trước khi mở tiếp.
  # CỐ Ý CHƯA BẬT ở đợt này: cpu/mem/iops z-drift. Lý do đo được, không phải phỏng
  # đoán: `omni:node_iops:z` hiện là 3,398 (> ngưỡng 3) nên bật là bắn tức thì, mất
  # cửa sổ quan sát và có nguy cơ vượt trần LLM 6,73 call/h của bảng BEFORE.
  # Mọi biểu thức BẮT BUỘC thu về đúng 1 series (`max`/`sum`) vì `_instant_scalar`
  # chỉ đọc `res[0]` — nhiều series thì nó chọn bừa. Đã kiểm từng cái trên Prometheus
  # GCP: cả 3 đều trả đúng series=1.
  # Trần ngân sách: cooldown 3600s/rule ⇒ tối đa 1 sự cố/rule/giờ.
  OMNI_PROACTIVE_PROMQL_RULES: |
    [
      {"name":"restart_accel","promql":"sum(increase(kube_pod_container_status_restarts_total{namespace=\"multi-agent\"}[15m]))","threshold":2},
      {"name":"replicas_unavailable","promql":"sum(kube_deployment_status_replicas_unavailable{namespace=\"multi-agent\"})","threshold":0},
      {"name":"crashloop_last_resort","promql":"sum(kube_pod_container_status_waiting_reason{reason=\"CrashLoopBackOff\"})","threshold":0}
    ]
  # S3 — tắt vòng ReAct riêng của proactive. KHÔNG phải "tắt proactive".
  #
  # Sau S1, việc sinh bằng chứng đã thoát khỏi cờ này: `_proactive_event_pipeline`
  # luôn gọi `run_diagnostic_pipeline`, evidence vẫn lên `omni-diagnostic-evidence`
  # và `evidence_consumer` vẫn suy luận. Cờ này giờ chỉ điều khiển ĐÚNG vòng ReAct
  # 6 lượt đắt tiền — một engine suy luận THỨ HAI chạy song song với analyst.
  #
  # Bằng chứng thật để tắt (trace `proact-s3probe-1786282369`, GCP 2026-08-09): cùng
  # một incident, cổng 3σ của analyst CHẶN advisory (z_cpu=-0,46 z_mem=-1,26 < 3 —
  # quyết định đúng, không đủ cơ sở để suy luận), nhưng vòng ReAct vẫn tiêu 2 lượt
  # LLM (27,5s + 11,8s = 39,3s) trên chính incident đó. Tức engine thứ hai KHÔNG đi
  # qua cổng mà engine thứ nhất phải qua — chi tiêu LLM đúng vào những ca đã được
  # quyết định là không nên suy luận.
  #
  # Đảo lại: sửa "false" -> "true" ở đây rồi deploy. Không mất dữ liệu.
  OMNI_PROACTIVE_FALLBACK_ENABLED: "false"
  OMNI_BASELINE_SNAPSHOT_ENABLED: "true"
  OMNI_BASELINE_SNAPSHOT_INTERVAL_SEC: "600"
  OMNI_BASELINE_SNAPSHOT_REDIS_TTL_SEC: "600"
  OMNI_BASELINE_MANIFEST_MAX_CHARS: "1400"
  OMNI_BASELINE_SYSTEM_PROMPT_MAX_CHARS: "1600"
  OMNI_BASELINE_DR_Z_THRESHOLD: "3.0"
  OMNI_BASELINE_PROMQL_Z_CPU: "omni:node_cpu:z"
  OMNI_BASELINE_PROMQL_Z_MEM: "omni:mem:z"
  OMNI_BASELINE_PROMQL_Z_DISK: "omni:node_disk:z"
  OMNI_BASELINE_PROMQL_Z_NET: ""
  OMNI_BASELINE_PROMQL_SEASONAL_CPU: "omni:health:cpu_seasonal_drift_z"
  OMNI_CHS_WEIGHTS: '{"cpu":0.25,"mem":0.25,"disk":0.25,"net":0.25}'
  OMNI_CHS_THRESHOLD: "10"
  OMNI_GOLDEN_LATENCY_PROMQL: ""
  OMNI_LATENCY_THRESHOLD_MS: ""
  OMNI_BASELINE_LEGACY_CPU_DRIFT_FOR_DR: "false"
  OMNI_BASELINE_CPU_DRIFT_THRESHOLD: "0.15"
  OMNI_BASELINE_PROMQL: ""
  OMNI_BASELINE_SNAPSHOT_MAX_CHARS: "1800"
  OMNI_GOD_MODE: "false"
  OMNI_AUTONOMOUS_DECIDER_ENABLED: "false"
  OMNI_AUTONOMOUS_DECIDER_INTERVAL_SEC: "300"
  OMNI_AUTONOMOUS_FIX_COOLDOWN_SEC: "600"
  OMNI_AUTONOMOUS_SAFE_TOOLS: "k8s_rollout_restart,redis_health,redis_expert_check,sandbox_cleanup"
  OMNI_AUTONOMOUS_ALLOWED_NAMESPACES: "multi-agent"
  OMNI_SHADOW_OS_MODE: "true"
  OMNI_AUTO_EXECUTE_ENABLED: "false"
  OMNI_SIEM_SUGGEST_ONLY: "true"
  OMNI_MULTI_HYPOTHESIS_SHADOW_ONLY: "true"
  OMNI_SHADOW_INFLUENCE_SUGGEST_ONLY: "true"
  OMNI_HITL_ROUTING_ENABLED: "true"
  OMNI_AUTONOMOUS_ROLLOUT_ON_FAULT_INCIDENT: "false"
  OMNI_ALERT_QOS_NORMAL_CAP: "500"
  OMNI_ALERT_QOS_WINDOW_SEC: "60"
  OMNI_DLQ_ROLLUP_WINDOW_SEC: "60"
  OMNI_BLAST_RADIUS_ENABLED: "true"
  OMNI_BLAST_MAX_PODS: "10"
  OMNI_BLAST_CAPACITY_DROP_PCT: "20"
  OMNI_RAG_FRESHNESS_ENABLED: "true"
  OMNI_RAG_FRESHNESS_MAX_AGE_SEC: "2592000"
  OMNI_CLUSTER_VERSION: "gcp-k3s-single-node"
  OMNI_REDIS_URL: "redis://redis:6379/0"
  OMNI_REDIS_CLUSTER: "false"
  OMNI_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  OMNI_KAFKA_TOPIC_KNOWLEDGE_EVIDENCE: "omni-knowledge-evidence"
  OMNI_ENV_MODE: "prod"
  OMNI_LAB_CHAOS_CREDENTIAL_AUTOFIX_ENABLED: "true"
  OMNI_CLUSTER_FULL_ACCESS: "false"
  OMNI_LLM_FIRST_AUTONOMY_ENABLED: "true"
  OMNI_LEGACY_DETERMINISTIC_FALLBACK: "false"
  # Đ58 (2026-08-13): MacBook (Ollama host, Apple Silicon GPU) tắt — chuyển
  # sang NVIDIA NIM (hosted, OpenAI-compat, https://integrate.api.nvidia.com/v1).
  # OMNI_LLM_PROVIDER=nim là công tắc thật (src/llm/factory.py) — chuyển 2 field
  # base_url dưới sang NIM là không đủ nếu thiếu dòng này, factory sẽ vẫn dùng
  # api_key giả "ollama" và không bật rate limiter.
  #
  # 2 model tách biệt theo tần suất gọi, tối ưu để KHÔNG đụng rate limit free
  # tier 40 rpm (OMNI_NIM_RATE_LIMIT_RPM là giới hạn phía client, dùng chung 1
  # sliding-window cho cả chat+embed trên 1 key — xem _RateLimiter trong
  # src/llm/vllm_client.py): model nhẹ cho các slot gọi tần suất cao (chat mặc
  # định/helper/diag-evidence), model nặng CHỈ cho 2 slot quyết định ít gọi hơn
  # (reasoning engine + autonomous decider). Cả 4 model ID đã verify SỐNG bằng
  # curl thật với đúng API key này trước khi ghi vào đây (2026-08-13):
  # meta/llama-3.1-8b-instruct (~0.4s), meta/llama-3.1-70b-instruct (~16s) đều
  # 200 OK; qwen/qwen2.5-7b-instruct 404 (không có trên hosted endpoint dù có
  # trang doc), meta/llama-3.3-70b-instruct timeout 30s, nvidia/llama-3.1-nemotron
  # -70b-instruct 404 "not found for account", mixtral-8x22b 410 Gone (EOL
  # 2026-05-21) — cả 4 cái này ĐỪNG dùng lại mà không verify trước.
  OMNI_LLM_PROVIDER: "nim"
  OMNI_NIM_RATE_LIMIT_RPM: "40"
  OMNI_VLLM_BASE_URL: "https://integrate.api.nvidia.com/v1"
  OMNI_VLLM_EMBED_URL: "https://integrate.api.nvidia.com/v1"
  OMNI_OLLAMA_BASE_URL: "https://integrate.api.nvidia.com/v1"
  OMNI_VLLM_STREAM_FOR_SLI: "false"
  OMNI_LLM_SLI_METRICS_ENABLED: "true"
  VLLM_BASE_URL: "https://integrate.api.nvidia.com/v1"
  VLLM_EMBED_URL: "https://integrate.api.nvidia.com/v1"
  VLLM_MODEL: "meta/llama-3.1-8b-instruct"
  OMNI_LLM_NUM_PARALLEL: "1"
  OMNI_TELEGRAM_ENABLED: "true"
  OMNI_TELEGRAM_POLLING_ENABLED: "false"
  OMNI_CHAT_MODEL: "meta/llama-3.1-8b-instruct"
  OMNI_MODEL_REASONING_ENGINE: "meta/llama-3.1-70b-instruct"
  OMNI_MODEL_HEAVY_LIFTER: "meta/llama-3.1-70b-instruct"
  OMNI_MODEL_HELPER: "meta/llama-3.1-8b-instruct"
  OMNI_DIAG_EVIDENCE_LLM_MODEL: "meta/llama-3.1-8b-instruct"
  OMNI_AUTONOMOUS_DECIDER_MODEL: "meta/llama-3.1-70b-instruct"
  OMNI_EMBED_MODEL: "nvidia/nv-embedqa-e5-v5"
  OMNI_EMBED_DIM: "1024"
  # 1800 (30') đo được là quá dày: mỗi vòng synth lại TOÀN BỘ pod+service bằng LLM
  # (93 entity × ~9.5s tuần tự vì Ollama num_parallel=1 ≈ 15' LLM chạy liên tục cho
  # mỗi chu kỳ 30') và tranh hàng đợi với advisory thật. Dedup theo fingerprint đã
  # cắt gần hết call; 6h là nhịp quét phát hiện entity MỚI, không phải nhịp synth.
  OMNI_DEEP_SCOUT_INTERVAL_SEC: "21600"
  OMNI_AUTONOMOUS_SYNTH_REFRESH_SEC: "86400"
  OMNI_METRICS_LISTEN_PORT: "9090"
  OMNI_OPENSANDBOX_ENABLED: "false"
  OMNI_OPENSANDBOX_BASE_URL: "http://opensandbox-shim.opensandbox.svc.cluster.local:8888"
  OMNI_OPENSANDBOX_EXEC_PATH: "/api/v1/execute"
  OMNI_K8S_DEFAULT_NAMESPACE: "multi-agent"
  OMNI_MONITOR_STACK_NAMESPACE: "monitor"
  OMNI_AGENTIC_SLOW_PATH_ENABLED: "true"
  OMNI_AGENTIC_MAX_LLM_ITERATIONS: "5"
  OMNI_OTEL_TRACING_ENABLED: "false"
  OMNI_OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitor.svc.cluster.local:4317"
  OMNI_OTEL_SERVICE_NAME: "omni-worker"
  OMNI_GATEWAY_SILENCE_CHAOS_LAB: "false"
