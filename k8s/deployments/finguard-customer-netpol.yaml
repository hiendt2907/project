---
# NetworkPolicy: Allow HITL API in finguard-customer to receive only from omni-hitl-dispatcher
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hitl-api-from-omni
  namespace: finguard-customer
spec:
  podSelector:
    matchLabels:
      app: finguard-hitl-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: multi-agent
          podSelector:
            matchLabels:
              app: omni-hitl-dispatcher
      ports:
        - port: 8081
          protocol: TCP
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow outbound to Redis (finguard Redis for HITL state)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    # Allow outbound to Postgres (finguard audit DB)
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
---
# NetworkPolicy: Deny all ingress to finguard-customer by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: finguard-customer
spec:
  podSelector: {}
  policyTypes:
    - Ingress
