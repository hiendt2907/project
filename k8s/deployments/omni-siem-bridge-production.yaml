---
# Production-grade SIEM Bridge manifest.
# Translates FinGuard Redis Streams → Omni Kafka `omni-alerts`.
# Differences from lab YAML:
#   - ServiceAccount (no K8s API perms needed)
#   - PodDisruptionBudget: minAvailable=1 (bridge is the only ingress path)
#   - NetworkPolicy: egress-only to Kafka, FinGuard Redis, DNS
#   - Liveness/readiness: process-level exec probes
#   - Rolling update: maxUnavailable=0 — never drop events in-flight
#   - Secret managed out-of-band (see bootstrap comment at bottom)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-siem-bridge
  namespace: multi-agent
  labels:
    app.kubernetes.io/name: omni-siem-bridge
    app.kubernetes.io/component: bridge
    app.kubernetes.io/part-of: omni
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-siem-bridge
  namespace: multi-agent
  labels:
    app: omni-siem-bridge
    app.kubernetes.io/name: omni-siem-bridge
    app.kubernetes.io/component: bridge
    app.kubernetes.io/part-of: omni
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: omni-siem-bridge
  template:
    metadata:
      labels:
        app: omni-siem-bridge
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: omni-siem-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: siem-bridge
          image: multi-agent-system:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "workers.siem_bridge"]
          env:
            - name: SIEM_BRIDGE_REDIS_URL
              value: "redis://redis.finguard-customer.svc.cluster.local:6379"
            - name: SIEM_BRIDGE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finguard-redis-bridge-secret
                  key: password
            - name: SIEM_BRIDGE_STREAM
              value: "stream:actionable_incidents"
            - name: SIEM_BRIDGE_GROUP
              value: "omni-bridge-consumers"
            - name: SIEM_BRIDGE_CONSUMER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OMNI_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: OMNI_KAFKA_TOPIC_ALERTS
              value: "omni-alerts"
            - name: SIEM_BRIDGE_DEFAULT_NAMESPACE
              value: "multi-agent"
            - name: SIEM_HITL_REQUIRED_CATEGORIES
              value: "ddos,malware,data_exfil,k8s_threat,lateral_movement"
            - name: OMNI_ENV_MODE
              value: "prod"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import workers.siem_bridge; print('ok')"
            initialDelaySeconds: 15
            periodSeconds: 60
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import workers.siem_bridge; print('ok')"
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 2
            timeoutSeconds: 8
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omni-siem-bridge-pdb
  namespace: multi-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: omni-siem-bridge
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omni-siem-bridge-netpol
  namespace: multi-agent
spec:
  podSelector:
    matchLabels:
      app: omni-siem-bridge
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Omni Kafka (same namespace)
    - ports:
        - port: 9092
          protocol: TCP
    # FinGuard Redis (cross-namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: finguard-customer
      ports:
        - port: 6379
          protocol: TCP
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
# Secret is managed out-of-band — do NOT add a Secret document here.
# Bootstrap (first-time only):
#   kubectl create secret generic finguard-redis-bridge-secret \
#     --from-literal=password="<redis-password>" \
#     -n multi-agent
