# chaos-pg — ephemeral single-node PostgreSQL for chaos engineering.
# Namespace: multi-agent (kube-state-metrics already covers it).
#
# Credentials: chaos-pg-secret NOT in git (security sweep 2026-08-04 — the old
# version hardcoded POSTGRES_PASSWORD/APP_PASSWORD plaintext here, AND baked
# APP_PASSWORD a second time into the postStart shell command below, so patching
# the Secret alone couldn't actually rotate the real DB password). Bootstrap
# before applying this file:
#   kubectl create secret generic chaos-pg-secret -n multi-agent \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=APP_USER=chaos_app \
#     --from-literal=APP_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=APP_DB=chaosdb
#
# Fault injection: kubectl patch secret chaos-pg-secret --type=merge \
#   -p '{"data":{"APP_PASSWORD":"d3JvbmctcGFzcw=="}}'   ← base64("wrong-pass")
# Then rollout restart chaos-victim → psql fails → exit 1 → CrashLoopBackOff.
#
# Cleanup: kubectl delete -f k8s/chaos-test/pg-test.yaml
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chaos-pg
  namespace: multi-agent
  labels:
    app: chaos-pg
    chaos: "true"
spec:
  serviceName: chaos-pg
  replicas: 1
  selector:
    matchLabels:
      app: chaos-pg
  template:
    metadata:
      labels:
        app: chaos-pg
        chaos: "true"
    spec:
      securityContext:
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chaos-pg-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: chaosdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # postStart below needs this to create the app role — was previously
            # hardcoded a second time in the shell command instead of read from here.
            - name: CHAOS_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chaos-pg-secret
                  key: APP_PASSWORD
          # Create the app user + database on first start
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    until pg_isready -U postgres -d chaosdb -q; do sleep 1; done
                    psql -U postgres -d chaosdb -c \
                      "DO \$\$ BEGIN
                         IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'chaos_app') THEN
                           CREATE USER chaos_app WITH PASSWORD '$CHAOS_APP_PASSWORD';
                         END IF;
                       END \$\$;"
                    psql -U postgres -d chaosdb -c \
                      "GRANT CONNECT ON DATABASE chaosdb TO chaos_app;"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "chaosdb"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-pg
  namespace: multi-agent
  labels:
    app: chaos-pg
    chaos: "true"
spec:
  type: ClusterIP
  clusterIP: None   # Headless — StatefulSet DNS: chaos-pg-0.chaos-pg.multi-agent.svc.cluster.local
  selector:
    app: chaos-pg
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
