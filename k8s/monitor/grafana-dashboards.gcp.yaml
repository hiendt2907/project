# GCP-only dashboard set — replaces the lab dashboards (omni_ops, omni_security,
# omni_learning, omni_pod_resources, omni_node_resources, omni_slo_minimum,
# omni_llm from k8s/monitor/grafana-dashboards.yaml + grafana-dashboard-llm.yaml)
# per explicit request 2026-08-04: delete all dashboards, rebuild from the
# project real current state so every documented capability has a visible
# panel. Built from the actual omni_* metric catalog live in Prometheus/Mimir
# at build time (114 omni_ series), not from aspirational metric names —
# every expr here was verified to return real data before being committed.
# Applied only by the GCP Jenkinsfile; the lab file above stays untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-gcp
  namespace: monitor
  labels:
    app: grafana
    grafana_dashboard: "1"
    grafana_folder: omni
