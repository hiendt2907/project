# Redis exporter — metrics → Prometheus scrape (namespace multi-agent)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: multi-agent
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          imagePullPolicy: IfNotPresent
          args:
            - --redis.addr=redis://redis.multi-agent.svc.cluster.local:6379
          ports:
            - name: metrics
              containerPort: 9121
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "25m"
              memory: 32Mi
            limits:
              cpu: "200m"
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: multi-agent
  labels:
    app: redis-exporter
spec:
  type: ClusterIP
  selector:
    app: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
