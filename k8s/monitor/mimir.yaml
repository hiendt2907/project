# Grafana Mimir — monolithic (demo-style), filesystem storage. Namespace: monitor.
# Query (Grafana): http://mimir:9009/prometheus — Remote write: http://mimir:9009/api/v1/push
# Do not use this minimal config for large production clusters without tuning limits/HA.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: monitor
  labels:
    app: mimir
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitor
  labels:
    app: mimir
data:
  mimir.yaml: |
    multitenancy_enabled: false

    server:
      http_listen_port: 9009
      log_level: info

    limits:
      ingestion_rate: 1000000
      ingestion_burst_size: 2000000
      max_global_series_per_user: 500000

    blocks_storage:
      backend: filesystem
      bucket_store:
        sync_dir: /data/mimir/tsdb-sync
      filesystem:
        dir: /data/mimir/data/tsdb
      tsdb:
        dir: /data/mimir/tsdb

    compactor:
      data_dir: /data/mimir/compactor
      sharding_ring:
        kvstore:
          store: inmemory

    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
        replication_factor: 1

    # Local scratch for mapped rules — must be writable (default ./data-ruler/ breaks non-root).
    ruler:
      rule_path: /data/mimir/data-ruler

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/rules

    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: inmemory

    activity_tracker:
      filepath: /data/mimir/activity.log
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: monitor
  labels:
    app: mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: mimir
          image: grafana/mimir:2.14.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/mimir/mimir.yaml
          ports:
            - name: http
              containerPort: 9009
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data/mimir
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitor
  labels:
    app: mimir
spec:
  type: ClusterIP
  selector:
    app: mimir
  ports:
    - name: http
      port: 9009
      targetPort: http
