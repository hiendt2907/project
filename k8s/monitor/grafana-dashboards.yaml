apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitor
  labels:
    app: grafana
    grafana_dashboard: "1"
    grafana_folder: omni
data:
  omni_ops.json: |
    {
      "title": "Omni Ops",
      "uid": "omni-ops",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": ["omni", "ops"],
      "time": { "from": "now-6h", "to": "now" },
      "templating": { "list": [ { "name": "namespace", "label": "namespace", "type": "query", "datasource": { "type": "prometheus", "uid": "mimir" }, "query": "label_values(up, kubernetes_namespace)", "current": { "selected": true, "text": "multi-agent", "value": "multi-agent" } }, { "name": "trace_id", "label": "trace_id", "type": "textbox", "query": "", "current": { "selected": true, "text": "", "value": "" } } ] },
      "panels": [
        { "id": 1, "type": "stat", "title": "Gateway 200 rate (5m)", "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 }, "datasource": { "type": "prometheus", "uid": "mimir" }, "targets": [ { "refId": "A", "expr": "sum(rate(omni_gateway_requests_total{status=\"200_ok\"}[5m]))" } ] },
        { "id": 2, "type": "stat", "title": "Auto verify success ratio (5m)", "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 }, "datasource": { "type": "prometheus", "uid": "mimir" }, "targets": [ { "refId": "A", "expr": "100 * (sum(increase(omni_proactive_verify_total{outcome=\"success\"}[5m])) / clamp_min(sum(increase(omni_proactive_verify_total[5m])), 1))" } ] },
        { "id": 3, "type": "stat", "title": "Active firing alerts", "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 }, "datasource": { "type": "prometheus", "uid": "mimir" }, "targets": [ { "refId": "A", "expr": "sum(ALERTS{alertstate=\"firing\"})" } ] },
        { "id": 4, "type": "stat", "title": "Ollama up", "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 }, "datasource": { "type": "prometheus", "uid": "mimir" }, "targets": [ { "refId": "A", "expr": "max(omni_ollama_up)" } ] },
        { "id": 5, "type": "timeseries", "title": "3-sigma CPU / MEM Z", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 }, "datasource": { "type": "prometheus", "uid": "mimir" }, "targets": [ { "refId": "A", "expr": "omni:node_cpu:z", "legendFormat": "cpu_z" }, { "refId": "B", "expr": "omni:mem:z", "legendFormat": "mem_z" } ] },
        { "id": 6, "type": "timeseries", "title": "Proactive outcome rates (5m)", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 }, "datasource": { "type": "prometheus", "uid": "mimir" }, "targets": [ { "refId": "A", "expr": "sum(rate(omni_proactive_outcome_total{outcome=\"react_resolved\"}[5m]))", "legendFormat": "resolved/s" }, { "refId": "B", "expr": "sum(rate(omni_proactive_outcome_total{outcome=\"react_escalated\"}[5m]))", "legendFormat": "escalated/s" } ] },
        { "id": 7, "type": "logs", "title": "Trace logs by trace_id", "gridPos": { "h": 10, "w": 24, "x": 0, "y": 13 }, "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "refId": "A", "expr": "{namespace=\"$namespace\", pod_name=~\"omni-prober.*|omni-analyst.*|omni-core.*|omni-executor.*|omni-gateway.*\"} |= \"$trace_id\"" } ] }
      ]
    }
  omni_security.json: |
    {
      "title": "Omni Security",
      "uid": "omni-security",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": ["omni", "security"],
      "time": { "from": "now-24h", "to": "now" },
      "templating": { "list": [ { "name": "namespace", "label": "namespace", "type": "query", "datasource": { "type": "prometheus", "uid": "mimir" }, "query": "label_values(up, kubernetes_namespace)", "current": { "selected": true, "text": "multi-agent", "value": "multi-agent" } } ] },
      "panels": [
        { "id": 1, "type": "stat", "title": "ERR_GOV events (1h)", "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 }, "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "refId": "A", "expr": "sum(count_over_time({namespace=\"$namespace\",pod_name=~\"omni-.*\"} |= \"ERR_GOV_\" [1h]))" } ] },
        { "id": 2, "type": "stat", "title": "Proof/Sigma blocks (1h)", "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 }, "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "refId": "A", "expr": "sum(count_over_time({namespace=\"$namespace\",pod_name=~\"omni-.*\"} |= \"ERR_REA_SIGMA_GATE_BLOCKED\" [1h])) + sum(count_over_time({namespace=\"$namespace\",pod_name=~\"omni-.*\"} |= \"ERR_REA_NO_PHYSICAL_PROOF\" [1h]))" } ] },
        { "id": 3, "type": "stat", "title": "Denied mutation attempts (1h)", "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 }, "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "refId": "A", "expr": "sum(count_over_time({namespace=\"$namespace\",pod_name=~\"omni-.*\"} |= \"ERR_GOV_UNAUTHORIZED_MUTATION\" [1h]))" } ] },
        { "id": 4, "type": "logs", "title": "Recent security reason codes", "gridPos": { "h": 10, "w": 24, "x": 0, "y": 5 }, "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "refId": "A", "expr": "{namespace=\"$namespace\", pod_name=~\"omni-.*\"} |~ \"ERR_GOV_|ERR_REA_\"" } ] },
        { "id": 5, "type": "text", "title": "Gate checklist", "gridPos": { "h": 5, "w": 24, "x": 0, "y": 15 }, "options": { "mode": "markdown", "content": "- `make secret-gate`\n- `make env-mode-gate`\n- `make mutate-only-gate`\n- `make classifier-regression-gate`\n- `make phase-docs-gate`\n\nIf runtime verify fails, classify as `infra_blocker` or `logic_blocker` before release." } }
      ]
    }
  omni_learning.json: |
    {
      "title": "Omni Learning",
      "uid": "omni-learning",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": ["omni", "learning"],
      "time": { "from": "now-24h", "to": "now" },
      "templating": { "list": [ { "name": "namespace", "label": "namespace", "type": "query", "datasource": { "type": "prometheus", "uid": "mimir" }, "query": "label_values(up, kubernetes_namespace)", "current": { "selected": true, "text": "multi-agent", "value": "multi-agent" } } ] },
      "panels": [
        { "id": 1, "type": "timeseries", "title": "Learning upserts trend", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }, "datasource": { "type": "prometheus", "uid": "mimir" }, "targets": [ { "refId": "A", "expr": "sum(rate(omni_learning_upserts_total[5m]))", "legendFormat": "upserts/s" } ] },
        { "id": 2, "type": "timeseries", "title": "Verified success vs failure", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }, "datasource": { "type": "prometheus", "uid": "mimir" }, "targets": [ { "refId": "A", "expr": "sum(rate(omni_proactive_verify_total{outcome=\"success\"}[5m]))", "legendFormat": "verified_success/s" }, { "refId": "B", "expr": "sum(rate(omni_proactive_verify_total{outcome=\"failed\"}[5m]))", "legendFormat": "verified_failed/s" } ] },
        { "id": 3, "type": "stat", "title": "Planner fallback events (1h)", "gridPos": { "h": 5, "w": 8, "x": 0, "y": 8 }, "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "refId": "A", "expr": "sum(count_over_time({namespace=\"$namespace\",pod_name=~\"omni-analyst.*|omni-core.*\"} |= \"PLANNER_FALLBACK\" [1h]))" } ] },
        { "id": 4, "type": "stat", "title": "Proof gate blocked (1h)", "gridPos": { "h": 5, "w": 8, "x": 8, "y": 8 }, "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "refId": "A", "expr": "sum(count_over_time({namespace=\"$namespace\",pod_name=~\"omni-.*\"} |= \"ERR_REA_SIGMA_GATE_BLOCKED\" [1h]))" } ] },
        { "id": 5, "type": "stat", "title": "No-physical-proof blocked (1h)", "gridPos": { "h": 5, "w": 8, "x": 16, "y": 8 }, "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "refId": "A", "expr": "sum(count_over_time({namespace=\"$namespace\",pod_name=~\"omni-.*\"} |= \"ERR_REA_NO_PHYSICAL_PROOF\" [1h]))" } ] },
        { "id": 6, "type": "logs", "title": "Learning evidence snapshots", "gridPos": { "h": 10, "w": 24, "x": 0, "y": 13 }, "datasource": { "type": "loki", "uid": "loki" }, "targets": [ { "refId": "A", "expr": "{namespace=\"$namespace\", pod_name=~\"omni-.*\"} |~ \"learning_upsert|action_experience|VERIFIED_SUCCESS|PLAN_EMITTED\"" } ] }
      ]
    }
