apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: omni-pipeline-alerts
  namespace: monitor
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: omni.pipeline
      interval: 30s
      rules:
        - alert: OmniAnalystProcessingLatencyHigh
          expr: >
            histogram_quantile(0.95,
              sum(rate(omni_evidence_processing_duration_seconds_bucket[5m])) by (le)
            ) > 30
          for: 5m
          labels:
            severity: warning
            team: omni-sre
          annotations:
            summary: "Analyst evidence processing p95 latency > 30s"
            description: >
              p95 processing latency is {{ $value | humanizeDuration }}.
              Check omni-analyst pod: LLM slow, Kafka lag, or Redis HNSW overloaded.

        - alert: OmniEvidenceStaleness
          expr: >
            (time() - omni_evidence_last_received_timestamp_seconds) > 3600
          for: 10m
          labels:
            severity: warning
            team: omni-sre
          annotations:
            summary: "No fresh evidence received in > 1h"
            description: >
              Last evidence received {{ $value | humanizeDuration }} ago.
              Check omni-prober and omni-evidence-adapter are running and producing.

        - alert: OmniPlaybookStateTTLExpiry
          expr: >
            omni_playbook_state_age_seconds{state="PENDING_APPROVAL"} > 7200
          for: 5m
          labels:
            severity: warning
            team: omni-sre
          annotations:
            summary: "Playbook stuck in PENDING_APPROVAL > 2h"
            description: >
              Playbook {{ $labels.playbook_id }} has been pending approval for
              {{ $value | humanizeDuration }}. HITL dispatcher may be stalled
              or FinGuard API unreachable.

        - alert: OmniKafkaProducerSendTimeout
          expr: >
            increase(omni_kafka_producer_send_timeout_total[5m]) > 0
          for: 2m
          labels:
            severity: critical
            team: omni-sre
          annotations:
            summary: "Kafka producer send timeouts detected"
            description: >
              {{ $value }} send timeout(s) in the last 5 minutes.
              Messages may be lost. Check Kafka broker health and network.
              Affected component: {{ $labels.component }}.

    - name: omni.slo
      interval: 60s
      rules:
        # ── Recording rules ──────────────────────────────────────────────────
        # MTTD: mean time to detect — use omni_kpi_mttd_seconds histogram
        - record: omni:slo:mttd_p95_seconds
          expr: >
            histogram_quantile(0.95, rate(omni_kpi_mttd_seconds_bucket[1h]))
            or omni_kpi_mttd_seconds
          labels:
            slo: mttd

        # MTTR: mean time to resolve
        - record: omni:slo:mttr_p95_seconds
          expr: >
            histogram_quantile(0.95, rate(omni_kpi_mttr_seconds_bucket[1h]))
            or omni_kpi_mttr_seconds
          labels:
            slo: mttr

        # False positive rate
        - record: omni:slo:false_positive_rate
          expr: omni_kpi_false_positive_rate
          labels:
            slo: false_positive

        # Advisory acceptance rate
        - record: omni:slo:advisory_acceptance_rate
          expr: omni_kpi_advisory_acceptance_rate
          labels:
            slo: acceptance

        # ── Alerting rules ───────────────────────────────────────────────────
        # MTTD SLO breach (non-SIEM lanes: 2m threshold)
        - alert: OmniMTTDBreached
          expr: omni:slo:mttd_p95_seconds{lane!="SIEM_SECURITY"} > 120
          for: 5m
          labels:
            severity: warning
            team: sre
          annotations:
            summary: "MTTD SLO breach on {{ $labels.lane }}"
            description: "P95 MTTD is {{ $value | humanizeDuration }} (SLO: 2m)"

        # SIEM MTTD SLO breach (longer 5m threshold for SIEM lane)
        - alert: OmniSIEMMTTDBreached
          expr: omni:slo:mttd_p95_seconds{lane="SIEM_SECURITY"} > 300
          for: 5m
          labels:
            severity: warning
            team: soc
          annotations:
            summary: "SIEM MTTD SLO breach"
            description: "SIEM P95 MTTD is {{ $value | humanizeDuration }} (SLO: 5m)"

        # MTTR SLO breach (15m threshold for auto-remediation)
        - alert: OmniMTTRBreached
          expr: omni:slo:mttr_p95_seconds > 900
          for: 10m
          labels:
            severity: warning
            team: sre
          annotations:
            summary: "MTTR SLO breach — {{ $labels.lane }}"
            description: "P95 MTTR is {{ $value | humanizeDuration }} (SLO: 15m for auto-remediation)"

        # False positive rate too high (> 10%)
        - alert: OmniFalsePositiveRateTooHigh
          expr: omni:slo:false_positive_rate > 0.10
          for: 15m
          labels:
            severity: warning
            team: sre
          annotations:
            summary: "False positive rate exceeded 10% threshold"
            description: "Current FP rate: {{ $value | humanizePercentage }}"

        # Advisory acceptance rate too low (< 85%)
        - alert: OmniAdvisoryAcceptanceLow
          expr: omni:slo:advisory_acceptance_rate < 0.85
          for: 15m
          labels:
            severity: warning
            team: sre
          annotations:
            summary: "Advisory acceptance rate below 85%"
            description: "Current rate: {{ $value | humanizePercentage }}"
