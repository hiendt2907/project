# Prometheus TSDB — thay VictoriaMetrics + vmagent (PromQL :9090)
# Gỡ VM cũ + PVC: xem k8s/monitor/MIGRATION_VM_TO_PROMETHEUS.md
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitor
  labels:
    app: prometheus
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
      - namespaces
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitor
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    remote_write:
      - url: http://mimir.monitor.svc.cluster.local:9009/api/v1/push
        queue_config:
          max_samples_per_send: 2000
          batch_send_deadline: 5s
    rule_files:
      - /etc/prometheus/omni-rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: keep
            regex: \d+
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed|Completed
            action: drop
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: kubernetes_node

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitor]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_address_target_kind, __meta_kubernetes_endpoint_address_target_name]
            regex: Pod;(.*)
            target_label: pod
            replacement: ${1}
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitor.svc.cluster.local:8080"]
  omni-rules.yml: |
    groups:
      - name: omni_baseline
        interval: 30s
        rules:
          - record: omni:cpu_busy:instant
            expr: avg(rate(node_cpu_seconds_total{mode!="idle"}[5m]))
          - record: omni:node_cpu:avg_24h
            expr: avg_over_time(omni:cpu_busy:instant[24h:5m])
          - record: omni:node_cpu:stddev_24h
            expr: stddev_over_time(omni:cpu_busy:instant[24h:5m])
          - record: omni:node_cpu:z
            expr: (omni:cpu_busy:instant - omni:node_cpu:avg_24h) / clamp_min(omni:node_cpu:stddev_24h, 1e-9)
          - record: omni:mem_avail_ratio:instant
            expr: avg(node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          - record: omni:node_mem:avg_24h
            expr: avg_over_time(omni:mem_avail_ratio:instant[24h:5m])
          - record: omni:node_mem:stddev_24h
            expr: stddev_over_time(omni:mem_avail_ratio:instant[24h:5m])
          - record: omni:mem:z
            expr: (omni:mem_avail_ratio:instant - omni:node_mem:avg_24h) / clamp_min(omni:node_mem:stddev_24h, 1e-9)
          - record: omni:disk_used_ratio:instant
            expr: avg(1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|squashfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|squashfs|overlay"}))
          - record: omni:node_disk:avg_24h
            expr: avg_over_time(omni:disk_used_ratio:instant[24h:5m])
          - record: omni:node_disk:stddev_24h
            expr: stddev_over_time(omni:disk_used_ratio:instant[24h:5m])
          - record: omni:node_disk:z
            expr: (omni:disk_used_ratio:instant - omni:node_disk:avg_24h) / clamp_min(omni:node_disk:stddev_24h, 1e-9)
          - record: omni:iops_total:instant
            expr: sum(rate(node_disk_reads_completed_total[5m])) + sum(rate(node_disk_writes_completed_total[5m]))
          - record: omni:node_iops:avg_24h
            expr: avg_over_time(omni:iops_total:instant[24h:5m])
          - record: omni:node_iops:stddev_24h
            expr: stddev_over_time(omni:iops_total:instant[24h:5m])
          - record: omni:node_iops:z
            expr: (omni:iops_total:instant - omni:node_iops:avg_24h) / clamp_min(omni:node_iops:stddev_24h, 1e-9)
      - name: omni_seasonal
        interval: 30s
        rules:
          - record: omni:health:cpu_seasonal_drift_z
            expr: |
              (
                (omni:cpu_busy:instant - omni:cpu_busy:instant offset 7d)
                / clamp_min(
                    stddev_over_time((omni:cpu_busy:instant offset 7d)[1h:5m]),
                    1e-9
                  )
              )
              or omni:node_cpu:z
      - name: omni_baseline_alerts
        rules:
          - alert: OmniBaselineCpuZHigh
            expr: abs(omni:node_cpu:z) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CPU Z-score exceeded 3-sigma"
              description: "abs(omni:node_cpu:z) > 3 (recording rule omni:node_cpu:z)"
          - alert: OmniBaselineMemZHigh
            expr: abs(omni:mem:z) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Memory Z-score exceeded 3-sigma"
              description: "abs(omni:mem:z) > 3 (recording rule omni:mem:z)"
          - alert: OmniBaselineDiskZHigh
            expr: abs(omni:node_disk:z) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Disk usage Z-score exceeded 3-sigma"
              description: "abs(omni:node_disk:z) > 3 (recording rule omni:node_disk:z; disk_used_ratio 0-1)"
      - name: omni_core_alerts
        rules:
          - alert: OmniGatewayDown
            expr: max(up{job="kubernetes-pods",kubernetes_namespace="multi-agent",kubernetes_pod_name=~"omni-gateway.*"}) < 1
            for: 2m
            labels:
              severity: critical
              domain: dataflow
            annotations:
              summary: "omni-gateway is down"
              description: "Gateway pod scrape is not up for 2m, alert ingress path may be broken."
          - alert: OmniWorkerDown
            expr: max(up{job="kubernetes-pods",kubernetes_namespace="multi-agent",kubernetes_pod_name=~"omni-worker.*"}) < 1
            for: 2m
            labels:
              severity: critical
              domain: logic
            annotations:
              summary: "omni-worker is down"
              description: "Worker pod scrape is not up for 2m, processing pipeline is halted."
          # OmniNoGatewayIngest removed: webhook chỉ có khi Alertmanager gửi — idle là bình thường, không phải sự cố.
          # OmniNoWorkerProcessing removed: idle lab (không Telegram/webhook) là bình thường; dùng OmniWorkerDown nếu cần.
          - alert: OmniRedisStandaloneDown
            expr: max(up{job="kubernetes-pods",kubernetes_namespace="multi-agent",kubernetes_pod_name=~"redis-[0-9]+"} == 1) < 1
            for: 2m
            labels:
              severity: critical
              domain: redis
            annotations:
              summary: "Redis standalone is down"
              description: "Expected redis StatefulSet pod scrape up; current max(up) is {{ $value }}."
          - alert: OmniRedisExporterDown
            expr: max(up{job="kubernetes-pods",kubernetes_namespace="multi-agent",kubernetes_pod_name=~"redis-exporter.*"}) < 1
            for: 2m
            labels:
              severity: warning
              domain: redis
            annotations:
              summary: "redis-exporter is down"
              description: "Redis metrics exporter scrape is down for 2m."
          - alert: OmniPostgresNodeLoss
            expr: count(up{job="kubernetes-pods",kubernetes_namespace="multi-agent",kubernetes_pod_name=~"omni-postgres-[0-9]+"} == 1) < 3
            for: 2m
            labels:
              severity: critical
              domain: db
            annotations:
              summary: "Postgres cluster node count dropped"
              description: "Expected 3 postgres pods up, current count is {{ $value }}."
          - alert: OmniPgpoolDown
            expr: max(kube_deployment_status_replicas_available{namespace="multi-agent",deployment="pgpool-gateway"}) < 1
            for: 2m
            labels:
              severity: critical
              domain: db
            annotations:
              summary: "pgpool-gateway is unavailable"
              description: "PGPool deployment has no available replicas."
          - alert: OmniK8sDeploymentUnavailable
            expr: sum(kube_deployment_status_replicas_unavailable{namespace="multi-agent"}) > 0
            for: 5m
            labels:
              severity: warning
              domain: k8s
            annotations:
              summary: "Deployment unavailable replicas detected"
              description: "Some deployments in namespace multi-agent have unavailable replicas."
          - alert: OmniPodCrashLoop
            expr: sum(increase(kube_pod_container_status_restarts_total{namespace="multi-agent"}[10m])) > 10
            for: 5m
            labels:
              severity: warning
              domain: k8s
            annotations:
              summary: "Pod restart spike in multi-agent"
              description: "Container restarts exceeded threshold in the last 10m."
          - alert: OmniOllamaDown
            expr: max(omni_ollama_up) < 1
            for: 3m
            labels:
              severity: critical
              domain: system
            annotations:
              summary: "Ollama probe failed"
              description: "omni_ollama_up is 0 for 3m."
          - alert: OmniProactiveVerificationFailSpike
            expr: sum(rate(omni_proactive_verify_total{outcome=~"fail|denied"}[10m])) > 0.2
            for: 10m
            labels:
              severity: warning
              domain: business
            annotations:
              summary: "Proactive verify fail/deny rate elevated"
              description: "Proactive verification fail/deny rate is above 0.2/s over 10m."
          - alert: OmniProactiveIncidentSlow
            expr: histogram_quantile(0.99, sum(rate(omni_proactive_incident_duration_seconds_bucket[10m])) by (le)) > 300
            for: 15m
            labels:
              severity: warning
              domain: business
            annotations:
              summary: "Proactive incident handling very slow (p99)"
              description: "p99 omni_proactive_incident_duration_seconds > 300s over 10m rate window (lab threshold; tune per cluster)."
          - alert: OmniLearningWriteFail
            expr: (sum(increase(omni_learning_upserts_total{outcome="fail"}[15m])) or vector(0)) >= 2
            for: 15m
            labels:
              severity: warning
              domain: logic
            annotations:
              summary: "Learning write failures detected (sustained)"
              description: "At least 2 action_experience learning upsert fails in a 15m window, for 15m (reduces single-blip / Missingseries flap)."
          - alert: OmniNetworkPacketDrop
            expr: sum(rate(node_network_receive_drop_total[5m]) + rate(node_network_transmit_drop_total[5m])) > 5
            for: 10m
            labels:
              severity: warning
              domain: network
            annotations:
              summary: "Network packet drops elevated"
              description: "Node packet drop rate is above threshold over 10m."
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitor
  labels:
    app: prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: monitor
  labels:
    app: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
            - --web.listen-address=0.0.0.0:9090
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitor
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
