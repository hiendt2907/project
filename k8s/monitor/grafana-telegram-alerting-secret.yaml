# Placeholder Telegram credentials for Grafana Unified Alerting (non-production).
# Replace before relying on notifications: kubectl create secret generic grafana-telegram-alerting -n monitor \
#   --from-literal=bot-token='...' --from-literal=chat-id='...' --dry-run=client -o yaml | kubectl apply -f -
# Or edit stringData and apply this file.
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-telegram-alerting
  namespace: monitor
  labels:
    app: grafana
type: Opaque
stringData:
  bot-token: "000000000:REPLACE_ME_BEFORE_USE"
  chat-id: "0"
