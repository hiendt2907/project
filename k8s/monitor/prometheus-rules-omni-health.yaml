apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: omni-health-alerts
  namespace: monitor
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: omni.worker.health
      interval: 30s
      rules:
        - alert: OmniWorkerStalled
          expr: omni_worker_last_message_age_seconds > 600
          for: 2m
          labels:
            severity: critical
            team: omni-sre
          annotations:
            summary: "Omni worker stalled — no messages for 10+ minutes"
            description: >
              Worker has not processed any message for {{ $value | humanizeDuration }}.
              Check Kafka consumer group, pod logs, and circuit breaker status.

        - alert: OmniWorkerHealthDegraded
          expr: min by (check_name) (omni_health_check_status) < 0.6
          for: 5m
          labels:
            severity: warning
            team: omni-sre
          annotations:
            summary: "Omni worker health check degraded: {{ $labels.check_name }}"
            description: >
              Health check {{ $labels.check_name }} has been degraded for 5+ minutes.
              Current value={{ $value }}. Investigate the affected component.

        - alert: OmniWorkerHealthUnhealthy
          expr: min by (check_name) (omni_health_check_status) == 0
          for: 2m
          labels:
            severity: critical
            team: omni-sre
          annotations:
            summary: "Omni worker health check FAILED: {{ $labels.check_name }}"
            description: >
              Health check {{ $labels.check_name }} is reporting UNHEALTHY for 2+ minutes.
              Immediate investigation required.

        - alert: OmniRedisConnectionLost
          expr: omni_health_check_status{check_name="redis_ping"} == 0
          for: 2m
          labels:
            severity: critical
            team: omni-sre
          annotations:
            summary: "Omni worker cannot reach Redis"
            description: >
              Redis ping health check has been failing for 2+ minutes.
              All advisory pipeline operations will fail. Check Redis pod and network policy.

        - alert: OmniLLMSustainedDown
          expr: omni_llm_up == 0
          for: 10m
          labels:
            severity: critical
            team: omni-sre
          annotations:
            summary: "Ollama LLM has been unreachable for 10+ minutes"
            description: >
              omni_llm_up=0 sustained. Advisory generation is blocked.
              All incoming evidence will queue. Check Ollama pod status and GPU/CPU resources.

    - name: omni.kpi
      interval: 60s
      rules:
        - alert: OmniAdvisoryAcceptanceRateLow
          expr: omni_kpi_advisory_acceptance_rate < 0.5
          for: 30m
          labels:
            severity: warning
            team: omni-sre
          annotations:
            summary: "Advisory acceptance rate below 50% in last 24h"
            description: >
              Acceptance rate={{ $value | humanizePercentage }}.
              High rejection rate may indicate LLM quality regression or misconfigured thresholds.

        - alert: OmniFalsePositiveRateHigh
          expr: omni_kpi_false_positive_rate > 0.3
          for: 30m
          labels:
            severity: warning
            team: omni-sre
          annotations:
            summary: "False positive rate exceeds 30%"
            description: >
              False positive rate={{ $value | humanizePercentage }}.
              Consider tuning detection thresholds or reviewing golden dataset.

        - alert: OmniMTTDHigh
          expr: histogram_quantile(0.95, rate(omni_kpi_mttd_seconds_bucket[1h])) > 300
          for: 15m
          labels:
            severity: warning
            team: omni-sre
          annotations:
            summary: "P95 Mean Time To Detect exceeds 5 minutes"
            description: >
              P95 MTTD={{ $value | humanizeDuration }}.
              Detection pipeline may be slow — check evidence adapter and prober latency.
