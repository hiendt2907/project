apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-headless
  namespace: multi-agent
spec:
  clusterIP: None
  # CỰC KỲ QUAN TRỌNG: Cho phép CoreDNS publish địa chỉ ngay cả khi Pod chưa Ready
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis-cluster
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: cluster
      port: 16379
      targetPort: 16379
