apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: omni-postgres
  namespace: multi-agent
spec:
  instances: 3
  imageName: omni-pgvector-cnpg:16
  imagePullPolicy: Never # Force it to use the locally built image on OrbStack
  
  bootstrap:
    initdb:
      database: ragdb
      owner: appuser
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  postgresql:
    parameters:
      shared_buffers: "2GB"
      work_mem: "256MB"
      maintenance_work_mem: "512MB"
      autovacuum_vacuum_scale_factor: "0.05"
      autovacuum_analyze_scale_factor: "0.02"

  storage:
    size: 20Gi
    storageClass: local-path
