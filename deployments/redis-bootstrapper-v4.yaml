apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-bootstrapper
  namespace: multi-agent
spec:
  template:
    spec:
      containers:
      - name: bootstrapper
        image: redis:7.4-alpine
        command:
        - /bin/sh
        - -c
        - |
          NODES="redis-cluster-0.redis-cluster-headless.multi-agent.svc.cluster.local \
                 redis-cluster-1.redis-cluster-headless.multi-agent.svc.cluster.local \
                 redis-cluster-2.redis-cluster-headless.multi-agent.svc.cluster.local \
                 redis-cluster-3.redis-cluster-headless.multi-agent.svc.cluster.local \
                 redis-cluster-4.redis-cluster-headless.multi-agent.svc.cluster.local \
                 redis-cluster-5.redis-cluster-headless.multi-agent.svc.cluster.local"
          
          echo "Starting Autonomous Cluster Healer..."
          
          while true; do
            echo "--- Health Check: $(date) ---"
            
            # DNS Check
            DNS_READY=true
            for node in $NODES; do
              if ! getent hosts $node > /dev/null; then
                echo "DNS not ready for $node"
                DNS_READY=false
              fi
            done
            
            if [ "$DNS_READY" = "false" ]; then
              sleep 5
              continue
            fi
            
            # Cluster Health Check
            STATE=$(redis-cli -h redis-cluster-0.redis-cluster-headless cluster info 2>/dev/null | grep cluster_state | cut -d: -f2 | tr -d '\r')
            
            if [ "$STATE" = "ok" ]; then
              echo "Cluster is Healthy. Sleeping 60s..."
              sleep 60
              continue
            fi
            
            echo "Cluster unhealthy (State: $STATE). Healing..."
            
            # Forced Mesh Meet (FQDN based)
            for n1 in $NODES; do
              IP1=$(getent hosts $n1 | awk '{print $1}')
              for n2 in $NODES; do
                if [ "$n1" != "$n2" ]; then
                  IP2=$(getent hosts $n2 | awk '{print $1}')
                  # MEET node2 from node1
                  redis-cli -h $IP1 cluster meet $IP2 6379 > /dev/null 2>&1 || true
                fi
              done
            done
            
            echo "Running cluster fix..."
            redis-cli --cluster fix redis-cluster-0.redis-cluster-headless:6379 --cluster-yes > /dev/null 2>&1 || true
            
            # Check if we need to bootstrap from scratch (only if all nodes are independent)
            NODES_COUNT=$(redis-cli -h redis-cluster-0.redis-cluster-headless cluster nodes 2>/dev/null | wc -l)
            if [ "$NODES_COUNT" -le 1 ]; then
              echo "Nodes are isolated. Performing fresh bootstrap..."
              CMD_NODES=""
              for n in $NODES; do CMD_NODES="$CMD_NODES $n:6379"; done
              redis-cli --cluster create $CMD_NODES --cluster-replicas 1 --cluster-yes
            fi
            
            sleep 30
          done
      restartPolicy: OnFailure
