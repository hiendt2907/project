apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: multi-agent
spec:
  serviceName: redis-cluster-headless
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-cluster
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["redis-server", "/conf/redis.conf"]
          ports:
            - containerPort: 6379
              name: redis
            - containerPort: 16379
              name: cluster
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /conf
      volumes:
        - name: redis-config
          configMap:
            name: redis-cluster-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
