apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-worker
  namespace: multi-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omni-worker
  template:
    metadata:
      labels:
        app: omni-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: omni-worker
      containers:
        - name: worker
          image: multi-agent-system:v6.4-chaos
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "workers.omni_worker"]
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: omni-worker-config
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: telegram-bot, key: bot-token } }
            - name: POSTGRES_RAG_DSN
              value: "postgresql://appuser:GD3fjTJJxfzi0bau6TSaoWV9Q8TeuEYxahQrFDh6DCnMRjgFdEQ1q7Hf3FKFbxD8@pgpool-gateway:5432/ragdb"
            - name: TELEGRAM_CHAT_ID
              valueFrom: { secretKeyRef: { name: telegram-bot, key: chat-id } }
            - name: OMNI_TELEGRAM_ADMIN_CHAT_ID
              valueFrom: { secretKeyRef: { name: telegram-bot, key: chat-id } }
