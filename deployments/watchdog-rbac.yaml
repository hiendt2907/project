apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-watchdog
  namespace: multi-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omni-watchdog-role
  namespace: multi-agent
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-watchdog-binding
  namespace: multi-agent
subjects:
- kind: ServiceAccount
  name: omni-watchdog
  namespace: multi-agent
roleRef:
  kind: Role
  name: omni-watchdog-role
  apiGroup: rbac.authorization.k8s.io
