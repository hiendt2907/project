apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-bootstrapper
  namespace: multi-agent
spec:
  template:
    spec:
      containers:
      - name: bootstrapper
        image: redis:7.4-alpine
        command:
        - /bin/sh
        - -c
        - |
          # 1. Chờ cho đến khi nslookup trả về đủ 6 IP
          while true; do
            IPs=$(nslookup redis-cluster-headless.multi-agent.svc.cluster.local | grep Address | grep -v '#' | awk '{print $2}')
            COUNT=$(echo "$IPs" | wc -w)
            if [ "$COUNT" -eq 6 ]; then
              echo "Found 6 nodes: $IPs"
              break
            fi
            echo "Waiting for 6 nodes (currently $COUNT)..."
            sleep 5
          done
          
          # 2. Xây dựng lệnh join
          CLUSTER_NODES=""
          for ip in $IPs; do
            CLUSTER_NODES="$CLUSTER_NODES $ip:6379"
          done
          
          # 3. Kích nổ Cluster
          echo "Executing: redis-cli --cluster create $CLUSTER_NODES --cluster-replicas 1 --cluster-yes"
          redis-cli --cluster create $CLUSTER_NODES --cluster-replicas 1 --cluster-yes
          
          echo "Verifying..."
          redis-cli -h redis-cluster-0.redis-cluster-headless cluster info
      restartPolicy: OnFailure
