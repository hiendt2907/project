apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-watchdog
  namespace: multi-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omni-watchdog
  template:
    metadata:
      labels:
        app: omni-watchdog
    spec:
      serviceAccountName: omni-watchdog
      containers:
      - name: watchdog
        image: multi-agent-system:v6.4-chaos
        imagePullPolicy: IfNotPresent
        command: ["python3", "-m", "sre.watchdog"]
        envFrom:
          - configMapRef:
              name: omni-worker-config
        env:
          - name: TELEGRAM_CHAT_ID
            valueFrom: { secretKeyRef: { name: telegram-bot, key: chat-id } }
