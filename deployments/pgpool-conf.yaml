# pgpool.conf for Omni Postgres HA (CNPG)
listen_addresses = '*'
port = 5432
pcp_port = 9898
socket_dir = '/tmp'
pcp_socket_dir = '/tmp'

# Backend nodes mapping to CNPG Services
backend_hostname0 = 'omni-postgres-rw'
backend_port0 = 5432
backend_weight0 = 1
backend_flag0 = 'ALWAYS_PRIMARY|DISALLOW_TO_FAILOVER'

backend_hostname1 = 'omni-postgres-ro'
backend_port1 = 5432
backend_weight1 = 1
backend_flag1 = 'DISALLOW_TO_FAILOVER'

# Pooled connections
num_init_children = 32
max_pool = 4
child_life_time = 300
child_max_connections = 0
connection_life_time = 0
client_idle_limit = 0

# Health check
health_check_period = 10
health_check_timeout = 5
health_check_user = 'postgres'

# Logging
log_destination = 'stderr'
log_statement = off
log_per_node_statement = off
log_connections = on
log_disconnections = on
log_error_verbosity = default

# Read-write splitting
load_balance_mode = on
master_slave_mode = on
master_slave_sub_mode = 'slony' # Generic but works for streaming too or 'stream'
search_path = 'public'
enable_read_only_query_processing = on

# Auth (Standard MD5/Password)
enable_pool_hba = off
pool_password_policy = 'md5'
