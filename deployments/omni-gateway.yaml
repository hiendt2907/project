apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-gateway
  namespace: multi-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omni-gateway
  template:
    metadata:
      labels:
        app: omni-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: multi-agent-system:v6.4-chaos
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "uvicorn", "gateway.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: omni-worker-config
