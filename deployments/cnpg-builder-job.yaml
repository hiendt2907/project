apiVersion: batch/v1
kind: Job
metadata:
  name: cnpg-image-builder
  namespace: multi-agent
spec:
  template:
    spec:
      containers:
      - name: builder
        image: docker:cli
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Building Postgres CNPG custom image..."
          cd /src/deployments/postgres-cnpg
          docker build -t omni-pgvector-cnpg:16 .
          
          echo "Building Official Pgpool-II custom image..."
          cd /src/deployments/pgpool-custom
          docker build -t pgpool-custom:16 .
          
          echo "Building Omni Worker image..."
          cd /src
          docker build -t omni-worker:latest .
          
          echo "Builds complete."
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
        - name: src-volume
          mountPath: /src
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: src-volume
        hostPath:
          path: /Users/hiendang/project
          type: Directory
      restartPolicy: Never
  backoffLimit: 0
